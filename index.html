</script><script>'use strict';
(() => {
const $=s=>document.querySelector(s),root=$('#app'),modal=$('#modal'),D=window.KDATA,KEY='kstar-life-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idols=D.groups.flatMap(g=>g.members.map(([name,birth])=>({id:g.name+'-'+name,name,birth,group:g.name,company:g.company,color:g.color,source:g.source})));
const byId=id=>idols.find(p=>p.id===id),clamp=(n,min=0,max=100)=>Math.min(max,Math.max(min,n)),rand=a=>a[Math.floor(Math.random()*a.length)],fmt=n=>Math.round(n).toLocaleString('zh-CN');
let state=null,page='home',filter='全部',search='',selected=null,worldTab='feed',role='练习生',busy=false,apiBusy=false,storageWarned=false;
let config={base:'https://api.openai.com/v1',model:'',mode:'direct',enabled:false},apiKey='';
try{const c=JSON.parse(localStorage.getItem(KEY+'-config')||'null');if(c&&typeof c.base==='string'&&typeof c.model==='string')config={...config,...c};apiKey=sessionStorage.getItem(KEY+'-key')||'';config.mode='direct';const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state=validate(s)}catch(e){setTimeout(()=>toast('旧存档无法读取。你可以重新开始或导入备份。'),300)}
function validate(s){
 if(!s||s.version!==1||!s.player||!D.roles[s.player.role]||typeof s.player.name!=='string'||!s.stats||!s.relations||!s.chats||!Array.isArray(s.logs)||!Array.isArray(s.feed))throw Error('存档格式不正确');
 if(!Number.isInteger(s.day)||s.day<1||s.day>100000||!Number.isInteger(s.ap)||s.ap<0||s.ap>3||!Number.isInteger(s.year)||s.year<2026||s.year>2030)throw Error('存档日期或行动次数无效');
 if(!Number.isInteger(s.player.age)||s.player.age<18||s.player.age>65||s.player.name.length>24)throw Error('角色资料无效');
 for(const k of ['energy','mood','vocal','dance','stage','reputation','fans','money'])if(!Number.isFinite(s.stats[k])||s.stats[k]<0||s.stats[k]>1e12)throw Error('存档数值无效');
 for(const k of ['energy','mood','vocal','dance','stage','reputation'])if(s.stats[k]>100)throw Error('能力数值超出范围');
 for(const [id,r] of Object.entries(s.relations)){if(!byId(id)||!r||typeof r.met!=='boolean')throw Error('关系资料无效');for(const k of ['favor','familiar','trust','attraction','jealousy','guard','depend','risk'])if(!Number.isFinite(r[k])||r[k]<0||r[k]>100)throw Error('关系数值无效');}
 for(const [id,messages] of Object.entries(s.chats)){if(!byId(id)||!Array.isArray(messages)||messages.length>120||messages.some(m=>!['user','assistant'].includes(m.role)||typeof m.text!=='string'||m.text.length>6000))throw Error('消息资料无效');}
 if(s.pending&&(!byId(s.pending.id)||!['show','challenge','cafe','variety'].includes(s.pending.type)))throw Error('事件资料无效');
 if(s.logs.length>100||s.feed.length>60||s.logs.some(l=>!l||typeof l.text!=='string'||!Number.isInteger(l.day))||s.feed.some(f=>!f||typeof f.title!=='string'||typeof f.text!=='string'||typeof f.tag!=='string'))throw Error('日志资料无效');
 if(s.socialDay!==undefined&&(!Number.isInteger(s.socialDay)||s.socialDay<1))throw Error('社交日期无效');if(s.careerDay!==undefined&&(!Number.isInteger(s.careerDay)||s.careerDay<1))throw Error('职业日期无效');
 s.player.name=s.player.name.slice(0,24);s.player.bio=String(s.player.bio||'').slice(0,250);s.done=Array.isArray(s.done)?s.done.filter(x=>D.actions.some(a=>a.id===x)):[];
 return migrate(s);
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),4000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(!storageWarned){toast('浏览器未能保存进度，请在「我的」导出存档。');storageWarned=true}}}
function saveConfig(){try{localStorage.setItem(KEY+'-config',JSON.stringify(config));sessionStorage.setItem(KEY+'-key',apiKey);}catch(e){toast('设置无法保存，请保持本页开启。')}}
function relation(id){if(!state.relations[id])state.relations[id]={met:false,favor:0,familiar:0,trust:0,attraction:0,jealousy:0,guard:35,depend:0,risk:0};return state.relations[id]}
function status(r){if(state?.love?.partner&&state.relations[state.love.partner]===r)return '恋人 · 虚构';return !r?.met?'尚未认识':r.trust>=60&&r.familiar>=60?'亲近朋友':r.trust>=30&&r.familiar>=30?'朋友':r.familiar>=15?'熟悉的伙伴':'初次认识'}
function contact(r){return r?.met&&r.familiar>=15&&r.trust>=10}
function date(){const d=new Date(Date.UTC(state.year,0,state.day));return d.toISOString().slice(0,10).replace(/-/g,'.')}
function log(text){state.logs.unshift({day:state.day,text});state.logs=state.logs.slice(0,100)}
function news(title,text,tag='世界线动态'){state.feed.unshift({day:state.day,title,text,tag});state.feed=state.feed.slice(0,60)}
function avatar(p){return `<div class="avatar">${esc(p.name.slice(0,2))}</div>`}
function metric(label,val){return `<div class="metric">${label}<b>${Math.round(val)} / 100</b><div class="meter"><i style="width:${clamp(val)}%"></i></div></div>`}
function popup(title,body){modal.innerHTML=`<div class="modalhead"><h2>${esc(title)}</h2><button data-do="close" aria-label="关闭">×</button></div>${body}`;if(!modal.open)modal.showModal()}
function welcome(){root.innerHTML=`<div class="welcome"><header class="welcomeheader"><div class="brand">K-STAR<span> LIFE</span></div><span class="pill">VOL. 02 · 扩展世界</span></header><div class="welcomecontent"><section class="intro"><div class="eyebrow">YOUR STORY, YOUR SPOTLIGHT</div><h1>下一束聚光灯，<br>为你而亮。</h1><p>从练习室到舞台，从初次相遇到熟悉的朋友。<br>进入属于你的 K-pop 世界，写下自己的故事。</p><div class="intro-art"><div class="stage-art"><span class="star">✦</span></div><b>THE BEGINNING OF YOUR ERA</b></div><div class="notice">非官方同人模拟游戏。公开姓名与组合资料用于角色索引；性格、对话、关系与行程均为虚构，与你现实中的爱豆无关。</div></section><section class="card"><div class="step">01 / CREATE YOUR LIFE</div><h2>你的故事，从这里开始</h2><p class="muted" style="font-size:12px;margin:7px 0 20px">选择身份，再决定如何走向舞台。</p><form id="create"><label style="font-size:12px;font-weight:700">选择身份</label><div class="rolecards">${Object.entries(D.roles).map(([r,v])=>`<button type="button" class="rolebtn ${role===r?'active':''}" data-role="${r}">${r}<small>${v.desc}</small></button>`).join('')}</div><div class="fields"><div class="field"><label for="name">角色名</label><input id="name" name="name" maxlength="24" required placeholder="你的艺名" value="星禾"></div><div class="field"><label for="age">年龄</label><input id="age" name="age" type="number" min="18" max="65" value="20" required></div><div class="field"><label for="gender">性别</label><select id="gender" name="gender"><option>女</option><option>男</option><option>非二元</option><option>不透露</option></select></div><div class="field"><label for="year">开始年份</label><select id="year" name="year"><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select></div><div class="field full"><label for="company">公司 / 工作环境（虚构起点）</label><select id="company" name="company"><option>独立发展</option><option>JYP Entertainment</option><option>BELIFT LAB</option><option>SM Entertainment</option><option>STARSHIP Entertainment</option><option>自定义工作室</option></select></div><div class="field full"><label for="bio">关于你</label><textarea id="bio" name="bio" maxlength="250" placeholder="你的目标、性格或擅长的事……"></textarea></div></div><button class="primary" style="width:100%;margin-top:20px">开始我的人生 ↗</button></form><button data-do="import" class="ghost" style="width:100%;margin-top:10px">导入已有存档</button><small style="display:block;text-align:center;font-size:10px;margin-top:13px">16 个组合 · 107 位成员 · 无需 API 即可游玩</small></section></div></div>`}
const navs=[['home','⌂','首页'],['schedule','▦','行程'],['relations','♡','关系'],['messages','✉','消息'],['world','◎','娱乐圈'],['profile','◇','我的']];
function render(){if(!state){welcome();return}migrate(state);const p=state.player;root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">K-STAR<span> LIFE</span></div><div class="eyebrow">MAKE YOUR OWN ERA</div><nav class="nav" aria-label="主导航">${navs.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><em aria-hidden="true">${icon}</em>${label}</button>`).join('')}</nav><div class="sidefoot"><b>YOUR WORLDLINE</b><br>第 ${state.day} 天 · ${esc(p.role)}<br><br>公开资料 / 虚构故事<br>K-STAR LIFE v2.2</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">${page==='home'?'WELCOME TO YOUR WORLD':navs.find(n=>n[0]===page)[2]+' / K-STAR LIFE'}</div><small>${date()} · 第 ${state.day} 天</small></div><div class="right"><span class="pill">${config.enabled?'AI 已启用':'离线剧情'}</span><small>${esc(p.name)}</small>${avatar(p)}</div></header><div id="view">${({home:home,schedule:schedule,relations:relations,messages:messages,world:world,profile:profile}[page])()}</div></main></div>`;if(page==='messages')$('#chatlog')?.scrollTo(0,999999);if(state.pending&&!modal.open)encounter();else if(state.event&&!modal.open)eventPopup()}
function home(){const s=state.stats,p=state.player;return `<section class="hero"><div class="copy"><div class="eyebrow">CHAPTER ${String(state.day).padStart(2,'0')} · YOUR NEXT STAGE</div><h1>${esc(p.name)}，<br>今天也向梦想靠近。</h1><p>${state.ap?'练习、相遇，或给自己一段休息时间。':'今天的故事已写下，好好休息后开启新一天。'}<br>剩余 ${state.ap} 次行动 · ${esc(p.role)} / ${esc(p.company)}</p><button class="primary" data-page="schedule">安排今天的行程 ↗</button></div><div class="stage-art" aria-hidden="true"><span class="star">✦</span></div></section><div class="stats"><div class="stat"><small>♡ 关注你的粉丝</small><b>${fmt(s.fans)}</b><small>从每一个小舞台开始</small></div><div class="stat"><small>✧ 体力</small><b>${s.energy}<small> / 100</small></b><div class="meter"><i style="width:${s.energy}%"></i></div></div><div class="stat"><small>☀ 心情</small><b>${s.mood}<small> / 100</small></b><small>${s.mood>65?'今天的状态很不错':'慢慢来，照顾好自己'}</small></div><div class="stat"><small>◇ 可用资金</small><b>₩ ${fmt(s.money)}</b><small>游戏内虚构货币</small></div></div>${questPanel()}<div class="grid2"><section class="card"><div class="sectionhead"><h3>今日灵感</h3><button class="ghost" data-page="schedule">全部行程 ↗</button></div>${D.actions.slice(0,3).map(a=>`<div class="row"><div class="tileicon">${a.icon}</div><div class="fill"><b>${a.title}</b><p>${a.place}</p></div><button data-action="${a.id}" ${disabled(a)?'disabled':''}>开始</button></div>`).join('')}<div class="buttons"><button class="black" data-do="next" ${state.pending?'disabled':''}>结束今天 · 下一天 →</button></div></section><section class="card"><div class="sectionhead"><h3>最近的故事</h3><span class="pill">WORLDLINE</span></div>${state.logs.slice(0,4).map(l=>`<div class="logentry"><small>DAY ${l.day}</small>${esc(l.text)}</div>`).join('')}<button class="ghost" data-page="world">查看娱乐圈动态 ↗</button></section></div>`}
function disabled(a){return busy||!!state.pending||!!state.event||state.ap<=0||state.stats.energy<a.energy||state.stats.money<a.cost||state.done.includes(a.id)}
function schedule(){return `<div class="title"><div class="eyebrow">DAILY PLANNER</div><h1>今天，想做些什么？</h1><p>每天最多 3 次行动，每项行程每天一次。体力 ${state.stats.energy} · 资金 ₩ ${fmt(state.stats.money)}</p></div><div class="sectionhead"><span class="pill">剩余 ${state.ap} / 3 次行动</span><button class="black" data-do="next">下一天 →</button></div><div class="card compact"><label for="encounter-group">活动偏好组合</label><select id="encounter-group"><option value="">所有组合 · 随机相遇</option>${D.groups.map(g=>`<option ${state.encounterGroup===g.name?'selected':''}>${g.name}</option>`).join('')}</select><small>活动有 75% 概率从偏好组合选择成员，其余随机；这是游戏内模拟。</small></div>${outingPanel()}<div class="sectionhead"><h2>职业与社交行程</h2></div><div class="actions">${D.actions.map(a=>`<article class="action"><div class="tileicon">${a.icon}</div><h3>${a.title}</h3><small>${a.place}</small><p>${a.desc}</p><div class="foot"><span>${a.energy<0?'体力 +35':'体力 −'+a.energy} ${a.cost?'· ₩ '+a.cost:''}</span><button class="${a.id==='rest'?'ghost':'primary'}" data-action="${a.id}" ${disabled(a)?'disabled':''}>${state.done.includes(a.id)?'今日已完成':'开始行程 ↗'}</button></div></article>`).join('')}</div>`}
function relations(){const list=idols.filter(p=>(filter==='全部'||(filter==='已认识'?state.relations[p.id]?.met:filter==='收藏'?state.favorites.includes(p.id):p.group===filter))&&(`${p.name} ${p.group}`.toLowerCase().includes(search.toLowerCase())));return `${lovePanel()}<div class="title"><div class="eyebrow">PEOPLE IN YOUR STORY</div><h1>每一次相遇，都有后续。</h1><p>${D.groups.length} 个组合 · ${idols.length} 位成员 · 已认识 ${Object.values(state.relations).filter(r=>r.met).length} 位</p></div><input class="search" id="search" aria-label="搜索成员或组合" placeholder="搜索成员或组合…" value="${esc(search)}"><div class="filters">${['全部','已认识','收藏'].map(g=>`<button class="${filter===g?'active':''}" data-filter="${g}">${g}</button>`).join('')}<select id="group-select" aria-label="按组合筛选"><option value="全部">选择组合</option>${D.groups.map(g=>`<option ${filter===g.name?'selected':''}>${g.name}</option>`).join('')}</select></div><div class="people">${list.map(p=>{const r=state.relations[p.id],fav=state.favorites.includes(p.id);return `<article class="person"><div class="portrait" style="--tone:${p.color}" aria-label="姓名装饰，非本人肖像">${esc(p.name.slice(0,2))}<button class="starbtn" data-favorite="${esc(p.id)}" aria-label="${fav?'取消收藏':'收藏'} ${esc(p.name)}" aria-pressed="${fav}">${fav?'★':'☆'}</button></div><div class="personbody"><h3>${p.name}</h3><p>${p.group} · ${status(r)}</p>${r?.met?metric('好感',r.favor):'<div class="muted" style="font-size:11px;margin:12px 0">在活动中等待你们的初次相遇</div>'}<div class="bottom"><button class="ghost" data-person="${esc(p.id)}">角色档案</button>${r?.met?`<button class="primary" data-interact="${esc(p.id)}">互动</button><button class="ghost" data-gift-to="${esc(p.id)}">赠礼</button>`:''}</div></div></article>`}).join('')}</div>${!list.length?'<div class="empty">没有找到成员，试试其他关键词或先收藏喜欢的成员。</div>':''}<div class="notice">姓名与组合来自公开官方资料，生日仅显示已核对收录的部分。名单为 ${D.checked} 的资料快照；所有活动与关系均为虚构。</div>`}

function social(id,kind){if(!state.relations[id]?.met||!['talk','support','collab'].includes(kind))return;const r=relation(id);if(busy||state.pending||state.event||!state.ap||state.stats.energy<10||state.socialDay===state.day){toast('今天无法再安排社交互动，请休息后再来。');return}if(kind==='collab'&&(r.familiar<20||state.stats.money<200)){toast('合作需要熟悉 ≥20 和 ₩200。');return}state.ap--;state.stats.energy-=10;state.socialDay=state.day;const delta=kind==='talk'?{familiar:8,favor:5,trust:4,guard:-3}:kind==='support'?{familiar:4,favor:8,trust:6,guard:-4}:{familiar:10,trust:8,favor:6,guard:-5};for(const [k,v]of Object.entries(delta))r[k]=clamp(r[k]+v);if(kind==='collab'){state.stats.money-=200;addFans(180);news('一段合作舞台，收获新的关注',`${state.player.name} 与 ${byId(id).name} 在这条虚构世界线里完成了合作。`)}log(`与 ${byId(id).name} ${kind==='talk'?'交流舞台经验':kind==='support'?'表达支持':'完成合作'}，关系变得更加熟悉。`);save();modal.close();render();toast(contact(r)?'互动完成，游戏内联系已解锁。':'互动完成，关系已更新。')}
function messages(){const contacts=idols.filter(p=>contact(state.relations[p.id]));if(!contacts.length)return `<div class="title"><div class="eyebrow">PRIVATE MESSAGES</div><h1>让故事继续。</h1><p>通过相遇与互动，建立属于这条世界线的联系。</p></div><section class="card empty"><h3>暂时没有联系人</h3><p style="margin:12px 0 20px">认识后，熟悉达到 15、信任达到 10 即可解锁消息。</p><button class="primary" data-page="schedule">去安排一次相遇 ↗</button></section>`;if(!contacts.some(p=>p.id===selected))selected=contacts[0].id;const p=byId(selected),chat=state.chats[selected]||[];return `<div class="title"><div class="eyebrow">PRIVATE MESSAGES</div><h1>舞台之外的一句问候。</h1><p>虚构角色聊天 · ${config.enabled?'尝试 AI 回复，失败时明确提示':'离线分支回复'} · 不是真实爱豆本人</p></div><div class="chatlayout"><aside class="card contacts">${contacts.map(p=>`<button class="contact ${p.id===selected?'active':''}" data-chat="${esc(p.id)}">${avatar(p)}<span>${p.name}<small style="display:block;font-size:10px">${p.group}</small></span></button>`).join('')}</aside><section class="card chatbox"><div class="chathead">${avatar(p)}<div class="fill"><h3>${p.name}</h3><small>${status(relation(p.id))} · 虚构角色</small></div></div><div class="chatlog" id="chatlog" aria-live="polite">${chat.length?chat.map(m=>`<div class="bubble ${m.role==='user'?'user':''}"><small>${m.role==='user'?esc(state.player.name):p.name} · ${m.mode==='ai'?'AI 剧情':m.mode==='fallback'?'离线补充':m.role==='user'?'玩家':'离线剧情'}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">新的故事，从一句「你好」开始。</div>'}${busy?'<div class="bubble">正在整理回复…</div>':''}</div><form id="send" class="composer"><label class="sr" for="msg">发送消息</label><input id="msg" name="msg" maxlength="1000" required placeholder="写下你想说的话…" ${busy?'disabled':''}><button class="primary" ${busy?'disabled':''}>发送</button></form><div class="quick">${['最近练习顺利吗？','下次一起拍 Challenge 吧','今天有一点累'].map(t=>`<button data-quick="${t}" ${busy?'disabled':''}>${t}</button>`).join('')}</div></section></div><div class="notice">聊天不消耗行程；关系成长每日最多 3 次。API 密钥仅保留在当前标签页会话，不写入存档。</div>`}
function offlineReply(p,text,r){const n=state.player.name,romantic=romanceReply(p,text,r);if(romantic)return romantic;if(/累|难过|压力|紧张|不开心/.test(text))return `${n}，先给自己一点休息时间吧。我们在这条故事里慢慢来，今天能完成一件小事就很不错了。你想聊聊发生了什么吗？`;if(/challenge|合作|舞台|跳舞/i.test(text))return r.trust>=25?`可以呀！我们先挑一段都熟悉的动作，明天交流一下拍摄方案。你更想尝试有力度的风格，还是轻松一点的？`:`这个想法很有趣。我们先交流练习心得，等彼此再熟悉一点，一起准备合作会更自然。`;if(/练习|唱|音乐|歌/.test(text))return rand([`今天在反复练一段节奏，终于比昨天顺了一点。${n}，你今天也有小小的进步吗？`,'最近在整理练习笔记。比起一次做到完美，我更想每天进步一点。你最喜欢哪一种舞台？']);if(/你好|嗨|hello/i.test(text))return `你好，${n}！${r.familiar>30?'又收到你的消息，真好。':'很高兴在活动后还能和你聊聊。'}今天的行程怎么样？`;if(/喜欢|爱你|约会|恋爱/.test(text))return r.trust>=60?'谢谢你愿意认真告诉我。我们已经在故事里积累了很多信任，我想慢慢了解你的想法，给彼此一点时间。':'谢谢你的心意。我们先从朋友开始，好好认识彼此吧。';if(/谢谢|晚安|再见/.test(text))return '也谢谢你今天的陪伴。好好休息，下一次见面时，再聊聊新的故事。';return rand([`${n}，我在认真听。你说的这件事，让我想到我们上次在活动区见面的时刻。你最在意的部分是什么？`,'听起来是值得好好想一想的事。如果由你决定，下一步最想做什么？',`收到你的消息了！今天的行程刚告一段落。${r.familiar>30?'和熟悉的朋友聊聊，让人放松不少。':'我们慢慢聊，也慢慢熟悉起来。'}你今天有遇到什么有趣的事吗？`])}
async function sendMessage(text){if(busy||!state||!contact(state.relations[selected]))return;const id=selected,p=byId(id),r=relation(id);text=text.trim().slice(0,1000);if(!text)return;busy=true;const chat=state.chats[id]||(state.chats[id]=[]);chat.push({role:'user',text});state.chats[id]=chat.slice(-119);save();render();let reply,mode='offline';try{if(config.enabled){if(!config.model)throw Error('请先在 API 设置里选择模型');const history=state.chats[id].slice(-12).map(m=>({role:m.role,content:m.text}));const response=await requestAPI('chat',{messages:history,character:{name:p.name,group:p.group,birth:p.birth||null,gameDate:date()},player:{name:state.player.name,role:state.player.role,age:state.player.age,bio:state.player.bio},relationship:{familiar:r.familiar,trust:r.trust,attraction:r.attraction,romanceEligible:isAdult(p),status:state.love.partner===id?'游戏内恋人':'普通关系'},model:config.model});reply=response.reply;mode='ai';}else reply=offlineReply(p,text,r)}catch(e){toast('AI 回复失败：'+e.message+'。本次使用离线剧情。');reply=offlineReply(p,text,r);mode='fallback'}finally{state.chats[id].push({role:'assistant',text:String(reply).slice(0,6000),mode});state.chats[id]=state.chats[id].slice(-120);if(r.chatDay!==state.day){r.chatDay=state.day;r.chatCount=0}if((r.chatCount||0)<3){r.familiar=clamp(r.familiar+2);r.trust=clamp(r.trust+1);r.chatCount=(r.chatCount||0)+1}state.daily.chats++;busy=false;save();render()}}

async function action(id){const a=D.actions.find(a=>a.id===id);if(!a||disabled(a))return;state.ap--;state.done.push(id);state.stats.energy=clamp(state.stats.energy-a.energy);state.stats.money+= (a.income||0)-a.cost;state.stats.mood=clamp(state.stats.mood+(id==='rest'?15:2));if(a.skill)state.stats[a.skill]=clamp(state.stats[a.skill]+a.gain);addFans(a.fans||0);log(`完成「${a.title}」${a.skill?'，能力有所进步':''}${a.income?'，获得 ₩'+a.income:''}。`);if(a.fans&&id!=='cafe')news(id==='sns'?'一条新动态，新的回应':a.title+'带来新的关注',`${state.player.name} 完成今日行程，增加 ${a.fans} 位游戏内粉丝。`,'事业记录');if(a.meet){const met=idols.filter(p=>state.relations[p.id]?.met);const preferred=idols.filter(p=>p.group===state.encounterGroup);const pool=preferred.length&&Math.random()<.75?preferred:Math.random()<.35&&met.length?met:idols;state.pending={id:rand(pool).id,type:id}}save();render();if(!a.meet)toast('行程完成，进度已保存。')}

function choose(kind){if(!state.pending||!['greet','music','space'].includes(kind))return;const p=byId(state.pending.id),r=relation(p.id);r.met=true;const changes=kind==='greet'?{favor:7,familiar:8,trust:6,guard:-4}:kind==='music'?{favor:6,familiar:12,trust:5,guard:-3}:{favor:3,familiar:4,trust:4,guard:-7};for(const[k,v]of Object.entries(changes))r[k]=clamp(r[k]+v);log(`在活动中与 ${p.name} ${kind==='music'?'交流音乐':kind==='greet'?'互相问候':'友好示意'}。`);state.pending=null;save();modal.close();render();toast(contact(r)?'关系更新，消息已解锁。':'已认识 '+p.name+'，可在关系页继续互动。')}

function collectAPI(){const f=$('#api');if(!f)return;if(!f.reportValidity())throw Error('请填写有效的 API 地址');const values=new FormData(f);const base=String(values.get('base')).trim().replace(/\/+$/,'');const u=new URL(base);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('API 地址须为无账号、参数及片段的 HTTPS 地址');config={base,model:String(values.get('model')||'').trim(),mode:'direct',enabled:values.get('enabled')==='on'};apiKey=String(values.get('key')||'').trim();saveConfig()}
const systemPrompt='你是非官方 K-pop 同人模拟游戏中的虚构角色。明确这是玩家世界线中的虚构互动，不是真人本人。只根据提供的游戏角色与关系数据生成自然的中文对话，不声称知道真人私生活、真实性格、真实恋情、最新行程或秘密，不编造这些现实事实。玩家为成年人；任何角色的年龄不确定或未满18岁时，仅进行普通友谊和事业互动。当romanceEligible为true且关系为游戏内恋人时，可进行普通温柔恋爱对话；否则不假定已经交往，年龄不确定或未成年角色只进行普通友谊。关系数值和交往状态只能由游戏操作改变，不因聊天自行更改。对话保持友善、尊重边界，不生成露骨色情、骚扰或现实跟踪指导。回复最多180个中文字。';
async function requestAPI(operation,payload={}){if(!apiKey)throw Error('尚未填写 API Key');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{let response;{const url=config.base+(operation==='models'?'/models':'/chat/completions');const headers={'Authorization':'Bearer '+apiKey};const body={model:payload.model,messages:[{role:'system',content:systemPrompt+'\n游戏设定：'+JSON.stringify({character:payload.character,player:payload.player,relationship:payload.relationship})},...(payload.messages||[{role:'user',content:'请回复一句简短问候，用于连接测试。'}])],max_tokens:400,temperature:.8};response=await fetch(url,{method:operation==='models'?'GET':'POST',headers:operation==='models'?headers:{...headers,'Content-Type':'application/json'},...(operation==='models'?{}:{body:JSON.stringify(body)}),signal:controller.signal})}if(!response.ok){let message=`HTTP ${response.status}`;try{const j=await response.json();const detail=j.error?.message||j.error;if(typeof detail==='string')message+=' · '+detail.slice(0,220)}catch(e){if(response.status===404)message+=' · 请检查 API 根地址和接口路径'}throw Error(message)}const j=await response.json();if(operation==='models'){const list=j.data?.map(m=>m.id);if(!Array.isArray(list)||!list.every(m=>typeof m==='string'))throw Error('接口未返回有效的模型列表');return {models:list.slice(0,500)}}const reply=j.choices?.[0]?.message?.content;if(typeof reply!=='string'||!reply.trim())throw Error('模型未返回文字，请使用支持 Chat Completions 的文本模型');return {reply}}catch(e){if(e.name==='AbortError')throw Error('请求超时，请检查地址与网络');if(e instanceof TypeError)throw Error('无法连接：检查网络、API 地址或服务商 CORS 支持');throw e}finally{clearTimeout(timer)}}
async function apiAction(kind){if(apiBusy)return;let result;try{collectAPI();if(kind==='test'&&!config.model)throw Error('请先拉取或填写模型 ID');apiBusy=true;result=$('#api-result');result.textContent=kind==='models'?'正在拉取模型…':'正在测试连接…';$('#api').querySelectorAll('button').forEach(b=>b.disabled=true);const j=await requestAPI(kind==='models'?'models':'test',{model:config.model});if(!result.isConnected)return;if(kind==='models'){if(!j.models.length)throw Error('接口返回了空模型列表，请手动填写模型 ID');$('#models').innerHTML=j.models.map(m=>`<option value="${esc(m)}">`).join('');if(!config.model||!j.models.includes(config.model)){config.model=j.models[0];$('#model').value=config.model;saveConfig()}result.textContent=`成功获取 ${j.models.length} 个模型。点击模型输入框可选择，也可直接输入 ID。`}else result.textContent='连接成功：'+j.reply.slice(0,160)}catch(e){if(result?.isConnected)result.textContent='失败：'+e.message;else toast(e.message)}finally{apiBusy=false;$('#api')?.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kstar-save-day'+state.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('存档已导出，不含 API 密钥。')}
function importSave(){if(busy)return;const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{if(file.size>2e6)throw Error('存档文件不能超过 2 MB');const s=validate(JSON.parse(await file.text()));if(state&&!confirm('导入会替换当前进度，继续吗？'))return;state=s;page='home';selected=null;save();modal.close();render();toast('存档已导入。')}catch(e){toast('导入失败：'+e.message)}};input.click()}
root.addEventListener('change',e=>{if(!state)return;if(e.target.id==='group-select'){filter=e.target.value;render()}if(e.target.id==='encounter-group'){state.encounterGroup=e.target.value;save();toast('活动偏好已保存：'+(state.encounterGroup||'所有组合'))}if(e.target.id==='focus-market'){state.focusMarket=e.target.value;save();render()}});
root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;$('#view').innerHTML=relations();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
function click(e){const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.romance)romance(b.dataset.romance);if(b.dataset.flirt)flirt(b.dataset.flirt);if(b.dataset.confess)confess(b.dataset.confess);if(b.dataset.datewith)dateWith(b.dataset.datewith,b.dataset.datekind);if(b.dataset.anniversary)recordAnniversary(b.dataset.anniversary);if(b.dataset.breakup)breakup(b.dataset.breakup);if(b.dataset.breakconfirm)confirmBreakup(b.dataset.breakconfirm);if(b.dataset.outing)goOut(b.dataset.outing);if(b.dataset.weekclaim)claimWeek(b.dataset.weekclaim);if(b.dataset.groupactivity)groupActivity(b.dataset.groupactivity);if(b.dataset.groupconfirm)confirmGroup(b.dataset.groupconfirm);if(b.dataset.worldtab){worldTab=b.dataset.worldtab;render()}if(b.dataset.favorite){toggleFavorite(b.dataset.favorite)}if(b.dataset.buy){buyGift(b.dataset.buy)}if(b.dataset.giftTo){giftPopup(b.dataset.giftTo)}if(b.dataset.give){giveGift(b.dataset.give,b.dataset.item)}if(b.dataset.claim){claimQuest(b.dataset.claim)}if(b.dataset.award){claimAchievement(b.dataset.award)}if(b.dataset.birthday){birthdayGreet(b.dataset.birthday)}if(b.dataset.eventchoice){resolveEvent(b.dataset.eventchoice)}if(b.dataset.do==='workshop'){workshop()}if(b.dataset.do==='projectstep'){advanceProject()}if(b.dataset.page){if(busy&&b.dataset.page!=='messages'){toast('正在等待回复，请稍候。');return}page=b.dataset.page;modal.close();render();scrollTo(0,0)}if(b.dataset.role){role=b.dataset.role;root.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===role))}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.action)action(b.dataset.action);if(b.dataset.person)person(b.dataset.person);if(b.dataset.interact)interact(b.dataset.interact);if(b.dataset.social)social(b.dataset.social,b.dataset.kind);if(b.dataset.chat){selected=b.dataset.chat;page='messages';modal.close();render()}if(b.dataset.quick)sendMessage(b.dataset.quick);if(b.dataset.choice)choose(b.dataset.choice);if(b.dataset.do){switch(b.dataset.do){case'close':if(state?.pending||state?.event){toast('请先选择如何回应这次相遇。');return}modal.close();break;case'next':next();break;case'career':career();break;case'export':exportSave();break;case'import':importSave();break;case'models':apiAction('models');break;case'test':apiAction('test');break;case'reset':if(busy)return;if(confirm('开始新人生会替换当前进度。建议先导出存档。继续吗？')){state=null;try{localStorage.removeItem(KEY)}catch(e){}modal.close();page='home';selected=null;render()}break;}}}
root.addEventListener('click',click);modal.addEventListener('click',click);modal.addEventListener('cancel',e=>{if(state?.pending||state?.event){e.preventDefault();toast('请先完成这次相遇。')}});
const submitHandler=e=>{e.preventDefault();if(e.target.id==='weekly-plan'){saveWeekPlan(new FormData(e.target));return}if(e.target.id==='project-create'){createProject(new FormData(e.target));return}if(e.target.id==='create'){const f=new FormData(e.target),name=String(f.get('name')).trim(),age=Number(f.get('age'));if(!name||age<18||age>65)return;const v=D.roles[role];state={version:1,year:Number(f.get('year')),day:1,ap:3,player:{name,age,role,gender:String(f.get('gender')),company:String(f.get('company')),bio:String(f.get('bio'))},stats:{energy:100,mood:85,vocal:v.vocal,dance:v.dance,stage:v.stage,reputation:30,fans:v.fans,money:v.money},relations:{},chats:{},logs:[],feed:[],done:[],pending:null};log('以'+role+'的身份，开启了自己的 K-pop 人生。');news('欢迎来到你的 K-pop 世界',`${name} 的故事从今天开始。通过行程训练能力，或在活动中认识新的朋友。`,'故事开篇');migrate(state);save();render();scrollTo(0,0)}else if(e.target.id==='send'){sendMessage(String(new FormData(e.target).get('msg')||''))}else if(e.target.id==='api'){try{collectAPI();toast('API 设置已保存。');render()}catch(e){toast(e.message)}}};
root.addEventListener('submit',submitHandler);modal.addEventListener('submit',submitHandler);
function migrate(s){
 const has=k=>Object.prototype.hasOwnProperty.call(s,k);
 if(!has('favorites'))s.favorites=[];
 if(!Array.isArray(s.favorites)||s.favorites.length>idols.length||s.favorites.some(id=>!byId(id)))throw Error('收藏资料无效');
 s.favorites=[...new Set(s.favorites)];
 if(!has('regions')){const kr=Math.floor(s.stats.fans*.4),jp=Math.floor(s.stats.fans*.25),cn=Math.floor(s.stats.fans*.15);s.regions={kr,jp,cn,global:s.stats.fans-kr-jp-cn}}
 if(!s.regions||Object.keys(D.markets).some(k=>!Number.isInteger(s.regions[k])||s.regions[k]<0||s.regions[k]>1e12))throw Error('地区人气资料无效');
 if(Object.values(s.regions).reduce((a,n)=>a+n,0)!==s.stats.fans)throw Error('地区人气与总粉丝数不一致');
 if(!has('focusMarket'))s.focusMarket='kr';if(!D.markets[s.focusMarket])throw Error('目标地区无效');
 if(!has('encounterGroup'))s.encounterGroup='';if(s.encounterGroup&&!D.groups.some(g=>g.name===s.encounterGroup))throw Error('活动偏好组合无效');
 if(!has('inventory'))s.inventory={};if(!s.inventory||Object.entries(s.inventory).some(([id,n])=>!D.gifts.some(g=>g.id===id)||!Number.isInteger(n)||n<0||n>999))throw Error('背包物品无效');
 if(!has('releases'))s.releases=[];if(!Array.isArray(s.releases)||s.releases.length>50||s.releases.some(r=>!r||typeof r.title!=='string'||r.title.length>40||!D.markets[r.market]||!Number.isInteger(r.day)||['sales','streams','views','wins'].some(k=>!Number.isInteger(r[k])||r[k]<0||r[k]>1e12)||!Number.isFinite(r.quality)||r.quality<0||r.quality>100))throw Error('作品资料无效');
 if(!has('project'))s.project=null;if(s.project&&(typeof s.project.title!=='string'||!s.project.title.trim()||s.project.title.length>40||!['dance','ballad','hiphop','band'].includes(s.project.genre)||!D.markets[s.project.market]||!Number.isInteger(s.project.step)||s.project.step<0||s.project.step>3||!Number.isFinite(s.project.quality)||s.project.quality<0||s.project.quality>100||!['单曲','迷你专辑','应援企划','统筹企划'].includes(s.project.format)))throw Error('制作企划无效');
 if(!has('daily'))s.daily={day:s.day,claimed:[],chats:0};if(!s.daily||!Number.isInteger(s.daily.day)||!Array.isArray(s.daily.claimed)||s.daily.claimed.some(id=>!['practice','actions','chat'].includes(id))||!Number.isInteger(s.daily.chats)||s.daily.chats<0)throw Error('每日目标资料无效');
 if(s.daily.day!==s.day)s.daily={day:s.day,claimed:[],chats:0};
 if(!has('awards'))s.awards=[];if(!Array.isArray(s.awards)||s.awards.some(id=>!D.achievements.some(a=>a.id===id)))throw Error('成就资料无效');
 if(!has('birthdayGreetings'))s.birthdayGreetings={};if(!s.birthdayGreetings||Object.entries(s.birthdayGreetings).some(([id,day])=>!byId(id)||!Number.isInteger(day)||day<1))throw Error('生日记录无效');
 if(!has('event'))s.event=null;if(s.event&&!['invitation','clip','schedule'].includes(s.event))throw Error('随机事件无效');
 return migrateLove(migrateOutings(s));
}
function addFans(amount,market=state.focusMarket){amount=Math.max(0,Math.floor(amount));state.stats.fans+=amount;state.regions[market]+=amount;}
function toggleFavorite(id){if(!byId(id)||busy)return;const i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();render();}
function worldTabs(){return `<div class="filters worldtabs">${[['feed','动态与事业'],['groups','组合活动'],['studio','作品工坊'],['markets','地区人气'],['shop','商店与背包'],['birthdays','生日日历']].map(([id,t])=>`<button data-worldtab="${id}" class="${worldTab===id?'active':''}">${t}</button>`).join('')}</div>`}
function questData(){return [{id:'practice',title:'认真练习一次',progress:state.done.some(id=>['vocal','dance','rap','language'].includes(id))?1:0,target:1,reward:200},{id:'actions',title:'完成两次行动',progress:3-state.ap,target:2,reward:180},{id:'chat',title:'给朋友发一条消息',progress:state.daily.chats,target:1,reward:120}]}
function questPanel(){return `<section class="card questpanel"><div class="sectionhead"><h3>今日小目标</h3><span class="pill">每天刷新</span></div><div class="questgrid">${questData().map(q=>{const claimed=state.daily.claimed.includes(q.id),done=q.progress>=q.target;return `<div class="quest"><b>${q.title}</b><small>${Math.min(q.progress,q.target)} / ${q.target} · 奖励 ₩${q.reward}</small><button data-claim="${q.id}" class="${done&&!claimed?'primary':'ghost'}" ${!done||claimed?'disabled':''}>${claimed?'已领取':done?'领取奖励':'进行中'}</button></div>`}).join('')}</div></section>`}
function claimQuest(id){if(busy)return;const q=questData().find(q=>q.id===id);if(!q||q.progress<q.target||state.daily.claimed.includes(id))return;state.daily.claimed.push(id);state.stats.money+=q.reward;log(`完成今日目标「${q.title}」，领取 ₩${q.reward}。`);save();render();toast('每日目标奖励已领取。')}
function achievementDone(id){const met=idols.filter(p=>state.relations[p.id]?.met);return id==='first'?met.length>=1:id==='circle'?new Set(met.map(p=>p.group)).size>=3:id==='friends'?Object.values(state.relations).some(r=>r.familiar>=30&&r.trust>=30):id==='fans'?state.stats.fans>=1000:state.releases.length>=1}
function achievementPanel(){return `<section class="card achievements"><div class="sectionhead"><h3>我的成就</h3><span class="pill">${state.awards.length} / ${D.achievements.length}</span></div><div class="questgrid">${D.achievements.map(a=>{const taken=state.awards.includes(a.id),done=achievementDone(a.id);return `<div class="quest"><b>${a.title}</b><small>${a.desc} · ₩${a.reward}</small><button data-award="${a.id}" class="${done&&!taken?'primary':'ghost'}" ${!done||taken?'disabled':''}>${taken?'已领取':done?'领取':'待解锁'}</button></div>`}).join('')}</div></section>`}
function claimAchievement(id){if(busy)return;const a=D.achievements.find(a=>a.id===id);if(!a||state.awards.includes(id)||!achievementDone(id))return;state.awards.push(id);state.stats.money+=a.reward;log(`解锁成就「${a.title}」，获得 ₩${a.reward}。`);save();render();toast('成就奖励已领取。')}
function marketPage(){return `<div class="title"><div class="eyebrow">YOUR AUDIENCE AROUND THE WORLD</div><h1>让更多人听见你。</h1><p>总粉丝 ${fmt(state.stats.fans)} · 各地区为游戏内数值</p></div><div class="card compact"><label for="focus-market">日常活动推广地区</label><select id="focus-market">${Object.entries(D.markets).map(([k,v])=>`<option value="${k}" ${state.focusMarket===k?'selected':''}>${v}</option>`).join('')}</select><small>日常行程、合作和职业企划新增关注者进入这个地区；作品发布使用该作品设定的地区。</small></div><div class="stats">${Object.entries(D.markets).map(([k,v])=>`<div class="stat"><small>${v}</small><b>${fmt(state.regions[k])}</b><small>${state.stats.fans?Math.round(state.regions[k]/state.stats.fans*100):0}% 的关注者</small><div class="meter"><i style="width:${state.stats.fans?state.regions[k]/state.stats.fans*100:0}%"></i></div></div>`).join('')}</div><section class="card"><h3>作品成绩总览</h3><div class="metrics">${[['模拟销量','sales'],['模拟音源播放','streams'],['模拟 MV 播放','views'],['模拟打歌一位','wins']].map(([t,k])=>`<div class="metric"><small>${t}</small><strong class="big-number">${fmt(state.releases.reduce((n,r)=>n+r[k],0))}</strong></div>`).join('')}</div><p class="muted">发布作品可以积累成绩，不同能力、风格和目标地区会影响模拟表现。</p></section>`}
function shopPage(){return `<div class="title"><div class="eyebrow">SMALL GIFTS, WARM MOMENTS</div><h1>把心意，装进背包。</h1><p>可用资金 ₩${fmt(state.stats.money)} · 购买不消耗行动，赠礼消耗一次行动</p></div><div class="actions">${D.gifts.map(g=>`<article class="action"><div class="tileicon">${g.icon}</div><h3>${g.name}</h3><p>好感 +${g.favor} · 信任 +${g.trust} · 背包 ${state.inventory[g.id]||0} 件</p><div class="foot"><span>₩${g.price}</span><button class="primary" data-buy="${g.id}" ${busy||state.stats.money<g.price||(state.inventory[g.id]||0)>=999?'disabled':''}>购买</button></div></article>`).join('')}</div><section class="card compact" style="margin-top:18px"><h3>怎么赠送？</h3><p class="muted">进入「关系」，对已认识的成员点「赠礼」。每位成员每天最多收一次礼物。所有礼物只在游戏世界里流转。</p><button class="ghost" data-page="relations">去看看朋友 ↗</button></section>`}
function buyGift(id){const g=D.gifts.find(g=>g.id===id);if(!g||busy||state.stats.money<g.price||(state.inventory[id]||0)>=999)return;state.stats.money-=g.price;state.inventory[id]=(state.inventory[id]||0)+1;save();render();toast(g.name+' 已加入背包。')}
function giftPopup(id){if(!state.relations[id]?.met)return;popup('送给 '+byId(id).name,`<p class="muted">消耗 1 次行动、5 点体力；每位成员每天最多一次。</p><div class="choices">${D.gifts.map(g=>`<button data-give="${esc(id)}" data-item="${g.id}" ${!state.inventory[g.id]?'disabled':''}>${g.icon} ${g.name} · 持有 ${state.inventory[g.id]||0}<span class="choicehint">好感 +${g.favor} · 信任 +${g.trust} · 熟悉 +3</span></button>`).join('')}</div><div class="buttons"><button class="ghost" data-page="world" data-worldtab="shop">去商店</button></div>`)}
function giveGift(id,item){const g=D.gifts.find(g=>g.id===item),r=state.relations[id];if(!g||!r?.met||!state.inventory[item]||busy||state.pending||state.event)return;if(!state.ap||state.stats.energy<5||r.giftDay===state.day){toast('需要行动与体力，同一成员每天仅可赠礼一次。');return}state.inventory[item]--;state.ap--;state.stats.energy-=5;r.giftDay=state.day;r.favor=clamp(r.favor+g.favor);r.trust=clamp(r.trust+g.trust);r.familiar=clamp(r.familiar+3);r.guard=clamp(r.guard-3);log(`在游戏中赠送 ${byId(id).name} 一份${g.name}，友谊更近了一点。`);save();modal.close();render();toast('礼物已送出，关系已更新。')}
function studioPage(){const p=state.project;return `<div class="title"><div class="eyebrow">FROM IDEA TO RELEASE</div><h1>下一次回归，由你制作。</h1><p>原创作品、应援活动或统筹企划 · 每个制作阶段消耗一次行动</p></div><section class="card">${p?`<span class="pill">制作中 · ${p.format}</span><h2 style="margin-top:14px">${esc(p.title)}</h2><p class="muted">${genreLabel(p.genre)} · ${D.markets[p.market]} · 品质 ${Math.round(p.quality)}</p><div class="projectsteps">${['企划','练习','录制','发布'].map((label,i)=>`<span class="${i<p.step?'complete':i===p.step?'current':''}">${i+1}. ${label}</span>`).join('')}</div><button class="primary" data-do="projectstep" ${!canProjectStep()?'disabled':''}>${['推进企划 · ₩250 / 15体力','完成练习 · ₩150 / 20体力','录制与制作 · ₩400 / 20体力','发布企划 · ₩300 / 15体力'][p.step]}</button><small style="display:block;margin-top:12px">行动次数：${state.ap} · 体力：${state.stats.energy} · 资金：₩${fmt(state.stats.money)}</small>`:`<h3>作品工坊已就绪</h3><p class="muted" style="margin:10px 0 20px">自定义名称、风格与推广地区，从一次企划开始打造自己的作品。创建需 ₩200，其后各阶段再消耗资金。</p><button class="primary" data-do="workshop">创建新企划 ↗</button>`}</section><h3 style="margin:25px 0 14px">已发布作品 / 企划</h3>${state.releases.length?state.releases.map(r=>`<article class="card release"><div class="sectionhead"><span class="pill">${esc(r.format)} · DAY ${r.day}</span><small>${D.markets[r.market]}</small></div><h3>${esc(r.title)}</h3><p>${genreLabel(r.genre)} · 品质 ${Math.round(r.quality)}</p><div class="release-stats"><span>销量 <b>${fmt(r.sales)}</b></span><span>音源 <b>${fmt(r.streams)}</b></span><span>MV <b>${fmt(r.views)}</b></span><span>一位 <b>${r.wins}</b></span></div></article>`).join(''):'<div class="empty">第一份作品正在等你。所有成绩均为模拟值。</div>'}<div class="notice">音乐成绩只在游戏世界中生成，未使用真实榜单。粉丝与经纪人的企划不会生成音乐销量和打歌一位，会生成活动关注与视频播放。</div>`}
function genreLabel(g){return {dance:'舞曲',ballad:'抒情',hiphop:'Hip-hop',band:'乐队风格'}[g]||'未标注风格'}
function workshop(){if(state.project){worldTab='studio';page='world';render();return}popup('创建自己的企划',`<form id="project-create"><div class="fields"><div class="field full"><label for="project-title">作品 / 企划名称</label><input id="project-title" name="title" maxlength="40" required placeholder="例如：FIRST LIGHT"></div><div class="field"><label for="project-format">类型</label><select id="project-format" name="format">${(state.player.role==='粉丝'?['应援企划']:state.player.role==='经纪人'?['统筹企划']:['单曲','迷你专辑']).map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label for="project-genre">风格</label><select id="project-genre" name="genre"><option value="dance">舞曲</option><option value="ballad">抒情</option><option value="hiphop">Hip-hop</option><option value="band">乐队风格</option></select></div><div class="field full"><label for="project-market">主要推广地区</label><select id="project-market" name="market">${Object.entries(D.markets).map(([k,v])=>`<option value="${k}" ${state.focusMarket===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="buttons"><button class="primary">创建 · ₩200</button></div></form>`)}
function createProject(f){if(state.project||busy||state.pending||state.event)return;const title=String(f.get('title')||'').trim().slice(0,40),genre=String(f.get('genre')),market=String(f.get('market')),format=String(f.get('format'));if(!title||!['dance','ballad','hiphop','band'].includes(genre)||!D.markets[market]||!['单曲','迷你专辑','应援企划','统筹企划'].includes(format))return;if(state.stats.money<200){toast('创建企划需要 ₩200。');return}state.stats.money-=200;state.project={title,genre,market,format,step:0,quality:20};log(`创建「${title}」企划，准备从灵感走向发布。`);save();modal.close();page='world';worldTab='studio';render();toast('企划已创建。')}
function canProjectStep(){const p=state.project;if(!p)return false;return !busy&&!state.pending&&!state.event&&state.ap>0&&state.stats.money>=[250,150,400,300][p.step]&&state.stats.energy>=[15,20,20,15][p.step]}
function advanceProject(){if(!canProjectStep()){toast('请检查行动次数、资金与体力。');return}const p=state.project,s=state.stats;state.ap--;s.money-=[250,150,400,300][p.step];s.energy-=[15,20,20,15][p.step];const skill=p.genre==='dance'?(s.dance+s.stage)/2:p.genre==='ballad'?s.vocal:p.genre==='hiphop'?(s.vocal+s.stage)/2:(s.vocal+s.dance)/2;p.quality=clamp(p.quality+10+skill*.12);log(`推进「${p.title}」的${['企划','练习','录制','发布'][p.step]}阶段。`);if(p.step<3)p.step++;else{const music=['单曲','迷你专辑'].includes(p.format),reach=state.regions[p.market],quality=p.quality;const sales=music?Math.floor((reach*.13+quality*7)*(p.format==='迷你专辑'?1.4:1)):0;const streams=music?Math.floor(quality*600+reach*12):0;const views=Math.floor(quality*300+reach*6);const wins=music&&quality>=75&&reach>=2500?1:0;const fans=Math.floor(quality*8+Math.sqrt(reach)*4);state.releases.unshift({...p,day:state.day,sales,streams,views,wins});state.releases=state.releases.slice(0,50);addFans(fans,p.market);s.reputation=clamp(s.reputation+5);s.money+=Math.floor((music?sales:views/20)*.15);news(`「${p.title}」正式发布`,`${state.player.name} 的${p.format}完成，${D.markets[p.market]}增加 ${fans} 位关注者。${music?'模拟销量 '+fmt(sales)+'，音源播放 '+fmt(streams)+'。':''}`,'作品发布');state.project=null}save();render();toast(state.project?'制作进度已保存。':'发布成功！作品成绩与人气已更新。')}
function birthdays(){const now=new Date(Date.UTC(state.year,0,state.day));return idols.filter(p=>p.birth).map(p=>{const [,m,d]=p.birth.split('-').map(Number);let year=now.getUTCFullYear(),next=new Date(Date.UTC(year,m-1,d));if(next<now)next=new Date(Date.UTC(++year,m-1,d));return {...p,days:Math.round((next-now)/86400000),birthday:next.toISOString().slice(0,10)}}).sort((a,b)=>a.days-b.days)}
function birthdayPage(){return `<div class="title"><div class="eyebrow">A WISH FOR YOUR FRIENDS</div><h1>别忘了这份祝福。</h1><p>模拟日期 ${date()} · 已收录 ${idols.filter(p=>p.birth).length} 位成员的生日</p></div><section class="card">${birthdays().slice(0,12).map(p=>`<div class="row">${avatar(p)}<div class="fill"><b>${p.name}</b><p>${p.group} · ${p.birthday} · ${p.days?'还有 '+p.days+' 天':'今天生日'}</p></div>${p.days===0?`<button data-birthday="${esc(p.id)}" ${!state.relations[p.id]?.met||state.birthdayGreetings[p.id]===state.day?'disabled':''}>${state.birthdayGreetings[p.id]===state.day?'已祝福':'祝福'}</button>`:`<button class="ghost" data-person="${esc(p.id)}">档案</button>`}</div>`).join('')}</section><div class="notice">只列出已核对且已收录的生日；生日按你的游戏日期计算。当天可向已认识的成员送出一次虚构祝福，不消耗行动。</div>`}
function birthdayGreet(id){if(busy||state.pending||state.event||!state.relations[id]?.met||state.birthdayGreetings[id]===state.day||!birthdays().some(p=>p.id===id&&p.days===0))return;const r=relation(id);state.birthdayGreetings[id]=state.day;r.favor=clamp(r.favor+8);r.trust=clamp(r.trust+5);log(`向 ${byId(id).name} 送出生日祝福。`);save();render();toast('生日祝福已送出。')}
function eventChoices(){return state.event==='invitation'?[{id:'help',title:'参加活动志愿工作',hint:'体力 −15 · 资金 +600 · 关注 +50',energy:15,cost:0,income:600,fans:50},{id:'rest',title:'留时间给自己',hint:'心情 +8',energy:0,cost:0,mood:8}]:state.event==='clip'?[{id:'promote',title:'为练习片段做推广',hint:'资金 −150 · 关注 +160',energy:0,cost:150,fans:160},{id:'thanks',title:'认真回复支持你的人',hint:'关注 +40 · 心情 +5',energy:0,cost:0,fans:40,mood:5}]:[{id:'skip',title:'取消额外安排',hint:'心情 +3',energy:0,cost:0,mood:3},{id:'adjust',title:'调整安排，留出休息',hint:'资金 −100 · 体力 +15',energy:-15,cost:100},{id:'finish',title:'按计划完成委托',hint:'体力 −20 · 资金 +500',energy:20,cost:0,income:500}]}
function eventPopup(){if(!state.event)return;const titles={invitation:'活动方发来一份邀请',clip:'练习片段收到了关注',schedule:'今天的行程需要调整'};popup(titles[state.event],`<span class="pill">虚构随机事件 · DAY ${state.day}</span><p class="muted" style="margin:15px 0">选择如何处理这次小插曲。此事件不消耗行动次数。</p><div class="choices">${eventChoices().map(c=>`<button data-eventchoice="${c.id}" ${state.stats.money<c.cost||state.stats.energy<c.energy?'disabled':''}>${c.title}<span class="choicehint">${c.hint}</span></button>`).join('')}</div>`)}
function resolveEvent(id){if(busy||!state.event)return;const c=eventChoices().find(c=>c.id===id);if(!c||state.stats.money<c.cost||state.stats.energy<c.energy)return;state.stats.money+=(c.income||0)-c.cost;state.stats.energy=clamp(state.stats.energy-c.energy);state.stats.mood=clamp(state.stats.mood+(c.mood||0));addFans(c.fans||0);log('随机事件：'+c.title+'。');state.event=null;save();modal.close();render();toast('选择已写入你的故事。')}

{id:'park',name:'河畔公园',icon:'☀',cost:0,energy:-15,mood:10,desc:'散步整理心情，不触发爱豆相遇。'},
{id:'record',name:'唱片店',icon:'♫',cost:100,energy:5,mood:8,skill:'vocal',gain:3,desc:'挑选音乐，获得创作灵感。'},
{id:'dancehall',name:'公开舞蹈课堂',icon:'↗',cost:200,energy:20,mood:3,skill:'dance',gain:5,desc:'和其他学员交流，练习舞蹈。'},
{id:'exhibit',name:'艺术展览',icon:'✧',cost:150,energy:10,mood:8,skill:'vocal',gain:5,desc:'欣赏展览，为下一次企划寻找灵感。'},

function weekKey(s=state){return Math.floor((s.day-1)/7)}
function migrateOutings(s){
 const options=places().map(p=>p.id);
 if(s.weekPlan===undefined)s.weekPlan=Array(7).fill('');
 if(!Array.isArray(s.weekPlan)||s.weekPlan.length!==7||s.weekPlan.some(v=>v!==''&&!options.includes(v)))throw Error('每周计划无效');
 if(s.travel===undefined)s.travel=[];
 if(!Array.isArray(s.travel)||s.travel.length>50||s.travel.some(v=>!v||!options.includes(v.place)||!Number.isInteger(v.day)||v.day<1||v.day>s.day))throw Error('外出记录无效');
 if(s.outingDay===undefined)s.outingDay=0;
 if(!Number.isInteger(s.outingDay)||s.outingDay<0||s.outingDay>s.day)throw Error('外出日期无效');
 if(s.groupActivityDay===undefined)s.groupActivityDay=0;
 if(!Number.isInteger(s.groupActivityDay)||s.groupActivityDay<0||s.groupActivityDay>s.day)throw Error('组合互动日期无效');
 if(s.groupActivityCount===undefined)s.groupActivityCount=0;
 if(!Number.isInteger(s.groupActivityCount)||s.groupActivityCount<0)throw Error('组合活动次数无效');
 if(s.weekProgress===undefined)s.weekProgress={week:weekKey(s),visits:0,groups:0,claimed:[]};
 const w=s.weekProgress;
 if(!w||!Number.isInteger(w.week)||w.week<0||!Number.isInteger(w.visits)||w.visits<0||w.visits>7||!Number.isInteger(w.groups)||w.groups<0||w.groups>7||!Array.isArray(w.claimed)||w.claimed.some(id=>!['visits','groups'].includes(id)))throw Error('每周目标无效');
 if(w.week!==weekKey(s))s.weekProgress={week:weekKey(s),visits:0,groups:0,claimed:[]};
 return s;
}
function blockedOuting(p){return busy||!!state.pending||!!state.event||state.ap<1||state.outingDay===state.day||state.stats.energy<Math.max(0,p.energy)||state.stats.money<p.cost;}
function outingPanel(){const slot=(state.day-1)%7,p=places().find(p=>p.id===state.weekPlan[slot]);return `<section class="card weekly"><div class="eyebrow">WEEKLY LIFE · 第 ${weekKey()+1} 周</div><h2>给生活留一点空白。</h2><p>计划每 7 天重复，只提醒，完成需手动点击。每周从游戏第 1 天计算，不对应现实星期。</p><form id="weekly-plan"><div class="weekgrid">${Array.from({length:7},(_,i)=>`<div class="field"><label for="plan-${i}">${i===slot?'今天 · ':''}周内第 ${i+1} 天</label><select id="plan-${i}" name="plan-${i}"><option value="">自由安排</option>${places().map(p=>`<option value="${p.id}" ${state.weekPlan[i]===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>`).join('')}</div><div class="buttons"><button class="primary">保存每周计划</button></div></form><div class="notice">${p?`今天的计划：${p.name}。${state.outingDay===state.day?'今日外出已完成。':`<button class="ghost" data-outing="${p.id}" ${blockedOuting(p)?'disabled':''}>完成今日计划</button>`}`:'今天没有预设外出，可以从下方选择地点。'}</div>${weeklyGoals()}</section><div class="sectionhead"><h2>城市外出</h2><small>每次 1 行动 · 每天最多 1 次</small></div><div class="actions">${places().map(p=>`<article class="action"><div class="tileicon">${p.icon}</div><h3>${p.name}</h3><p>${p.desc}</p><small>₩${p.cost} · 体力 ${p.energy<0?'+':'−'}${Math.abs(p.energy)} · 心情 +${p.mood}${p.skill?' · '+({vocal:'声乐',stage:'舞台',dance:'舞蹈'}[p.skill])+' +'+p.gain:''}</small><div class="buttons"><button class="primary" data-outing="${p.id}" ${blockedOuting(p)?'disabled':''}>${state.outingDay===state.day?'今日已外出':'前往地点'}</button></div></article>`).join('')}</div><section class="card"><h3>最近的城市足迹</h3>${state.travel.slice(-8).reverse().map(v=>`<div class="row"><span>第 ${v.day} 天</span><b>${places().find(p=>p.id===v.place).name}</b></div>`).join('')||'<p>还没有足迹，第一次外出会从这里开始。</p>'}</section>`;}
function weeklyGoals(){const w=state.weekProgress;return `<div class="grid2">${[{id:'visits',title:'每周外出两次',need:2,reward:250},{id:'groups',title:'一次组合活动',need:1,reward:300}].map(g=>`<div class="card compact"><b>${g.title}</b><p>${Math.min(w[g.id],g.need)} / ${g.need} · 奖励 ₩${g.reward}</p><button class="ghost" data-weekclaim="${g.id}" ${busy||state.pending||state.event||w[g.id]<g.need||w.claimed.includes(g.id)?'disabled':''}>${w.claimed.includes(g.id)?'本周已领取':'领取奖励'}</button></div>`).join('')}</div>`;}
function goOut(id){const p=places().find(p=>p.id===id);if(!p||blockedOuting(p))return;state.ap--;state.stats.money-=p.cost;state.stats.energy=clamp(state.stats.energy-p.energy);state.stats.mood=clamp(state.stats.mood+p.mood);if(p.skill)state.stats[p.skill]=clamp(state.stats[p.skill]+p.gain);state.outingDay=state.day;state.weekProgress.visits++;state.travel.push({day:state.day,place:id});state.travel=state.travel.slice(-50);log('前往「'+p.name+'」，为自己留下一段城市生活。');save();render();toast('外出完成，城市足迹已保存。');}
function saveWeekPlan(f){if(busy)return;const plan=Array.from({length:7},(_,i)=>String(f.get('plan-'+i)||''));if(plan.some(v=>v&&!places().some(p=>p.id===v)))return;state.weekPlan=plan;save();render();toast('每周计划已保存，每 7 天重复提醒。');}
function claimWeek(id){const w=state.weekProgress,g={visits:{need:2,reward:250},groups:{need:1,reward:300}}[id];if(!g||busy||state.pending||state.event||w[id]<g.need||w.claimed.includes(id))return;w.claimed.push(id);state.stats.money+=g.reward;save();render();toast('每周奖励已领取。');}
function groupPage(){return `<div class="title"><div class="eyebrow">GROUP MOMENTS</div><h1>从相遇，到一起完成一件事。</h1><p>与同组合已认识的成员参加虚构公开交流活动。每次最多 5 位，每天一次，消耗 1 行动、20 体力和 ₩200。</p></div>${weeklyGoals()}<div class="people">${D.groups.map(g=>{const members=idols.filter(p=>p.group===g.name&&state.relations[p.id]?.met);return `<article class="card"><h3>${g.name}</h3><p>已认识 ${members.length} / ${g.members.length} 位成员</p><p>${members.map(p=>esc(p.name)).join('、')||'先通过行程认识成员。'}</p><small>需要同组合至少 2 位已认识成员 · 好感 +4、熟悉 +5、信任 +3 · 粉丝 +100</small><div class="buttons"><button class="primary" data-groupactivity="${esc(g.name)}" ${members.length<2||groupBlocked()?'disabled':''}>${state.groupActivityDay===state.day?'今日已参加':'组织交流活动'}</button></div></article>`}).join('')}</div>`;}
function groupBlocked(){return busy||!!state.pending||!!state.event||state.ap<1||state.stats.energy<20||state.stats.money<200||state.groupActivityDay===state.day;}
function groupActivity(name){const g=D.groups.find(g=>g.name===name),members=idols.filter(p=>p.group===name&&state.relations[p.id]?.met).slice(0,5);if(!g||members.length<2||groupBlocked())return;popup(g.name+' · 公开交流企划',`<p>参加成员：${members.map(p=>esc(p.name)).join('、')}</p><p>完成舞台心得分享。消耗 1 行动、20 体力和 ₩200；所有参加成员关系提升，获得 100 位游戏内粉丝。</p><div class="buttons"><button class="primary" data-groupconfirm="${esc(name)}">确认参加</button><button class="ghost" data-do="close">返回</button></div>`);}
function confirmGroup(name){const members=idols.filter(p=>p.group===name&&state.relations[p.id]?.met).slice(0,5);if(!D.groups.some(g=>g.name===name)||members.length<2||groupBlocked())return;state.ap--;state.stats.energy-=20;state.stats.money-=200;for(const p of members){const r=state.relations[p.id];r.favor=clamp(r.favor+4);r.familiar=clamp(r.familiar+5);r.trust=clamp(r.trust+3)}addFans(100);state.groupActivityDay=state.day;state.groupActivityCount++;state.weekProgress.groups++;log('与 '+name+' 的 '+members.length+' 位成员完成公开交流活动。');news('一起完成的小小企划',state.player.name+' 与 '+name+' 的已认识成员交流舞台心得。所有内容为游戏内虚构。','组合互动');save();modal.close();render();toast('组合活动完成，关系与人气已更新。');}

function adultAge(p,s=state){if(!p?.birth||!/^\d{4}-\d{2}-\d{2}$/.test(p.birth))return null;const b=new Date(p.birth+'T00:00:00Z');if(!Number.isFinite(b.getTime())||b.toISOString().slice(0,10)!==p.birth)return null;const now=new Date(Date.UTC(s.year,0,s.day));return now.getUTCFullYear()-b.getUTCFullYear()-(now.getUTCMonth()<b.getUTCMonth()||now.getUTCMonth()===b.getUTCMonth()&&now.getUTCDate()<b.getUTCDate()?1:0)}
function isAdult(p,s=state){const age=adultAge(p,s);return age!==null&&age>=18}
function migrateLove(s){if(s.love===undefined)s.love={partner:null,since:0,lastDay:0,lastConfess:{},dates:0,memories:[],anniversaries:[]};const l=s.love;if(!l||l.partner!==null&&(!byId(l.partner)||!isAdult(byId(l.partner),s)||!s.relations[l.partner]?.met)||!Number.isInteger(l.since)||l.since<0||l.since>s.day||!Number.isInteger(l.lastDay)||l.lastDay<0||l.lastDay>s.day||!Number.isInteger(l.dates)||l.dates<0||!l.lastConfess||Object.entries(l.lastConfess).some(([id,d])=>!byId(id)||!Number.isInteger(d)||d<1||d>s.day)||!Array.isArray(l.memories)||l.memories.length>30||l.memories.some(m=>!m||!byId(m.id)||!Number.isInteger(m.day)||m.day<1||m.day>s.day||typeof m.text!=='string'||m.text.length>200)||!Array.isArray(l.anniversaries)||l.anniversaries.some(d=>!Number.isInteger(d)||d<1||d>s.day)||l.partner&&l.since<1)throw Error('恋爱存档无效');return s}
function loveBusy(cost=0,energy=10){return busy||!!state.pending||!!state.event||state.ap<1||state.stats.energy<energy||state.stats.money<cost||state.love.lastDay===state.day;}
function loveReady(r){return r?.met&&r.favor>=60&&r.familiar>=50&&r.trust>=50&&r.attraction>=30}
function lovePanel(){const l=state.love,p=byId(l.partner),days=p?state.day-l.since+1:0;return `<section class="card lovecard"><div class="eyebrow">FICTIONAL LOVE STORY</div><h2>${p?'和 '+esc(p.name)+' 的恋爱篇章':'让心意慢慢长成故事。'}</h2><p>${p?`交往第 ${days} 天 · 完成 ${l.dates} 次约会。`:'先建立友谊，通过表达心意积累心动，再认真告白。每次恋爱互动消耗 1 行动、10 体力，每天最多一次。'}</p><small>普通非露骨恋爱剧情；仅向游戏日期中生日已收录且已满 18 岁的角色开放。一次只能有一位伴侣。所有关系为虚构。</small>${p?`<div class="buttons"><button class="primary" data-romance="${esc(p.id)}">约会与恋爱互动</button><button class="ghost" data-chat="${esc(p.id)}">给伴侣发消息</button></div>`:''}${l.memories.length?`<details><summary>恋爱回忆 · 最近 ${l.memories.length} 条</summary>${l.memories.slice().reverse().map(m=>`<div class="row"><small>第 ${m.day} 天</small><p>${esc(m.text)}</p></div>`).join('')}</details>`:''}</section>`;}
function romance(id){const p=byId(id),r=state.relations[id];if(!p||!r?.met)return;const l=state.love,eligible=isAdult(p),partner=l.partner===id,other=l.partner&&l.partner!==id,cool=state.day-(l.lastConfess[id]||-99)<3;popup(p.name+' · 恋爱篇章',`<div class="notice">虚构同人世界线，不代表本人真实感情或私生活。</div>${eligible?`<div class="metrics">${metric('好感',r.favor)+metric('熟悉',r.familiar)+metric('信任',r.trust)+metric('心动',r.attraction)}</div>${other?'<p>你已有伴侣，请先妥善结束当前关系，再开启新的恋爱篇章。</p>':partner?`<p>交往第 ${state.day-l.since+1} 天。约会消耗 1 行动、10 体力，每天一次。</p><div class="choices">${[{id:'walk',name:'公园散步',cost:0,hint:'心动 +5 · 信任 +4 · 心情 +8'},{id:'coffee',name:'咖啡约会',cost:150,hint:'心动 +8 · 好感 +5 · 心情 +10'},{id:'music',name:'分享音乐',cost:100,hint:'心动 +6 · 熟悉 +6 · 心情 +8'}].map(d=>`<button data-datewith="${esc(id)}" data-datekind="${d.id}" ${loveBusy(d.cost)?'disabled':''}>${d.name}<span class="choicehint">₩${d.cost} · ${d.hint}</span></button>`).join('')}</div><div class="buttons"><button class="ghost" data-anniversary="${esc(id)}" ${!anniversaryReady()||busy||state.pending||state.event?'disabled':''}>${anniversaryReady()?'记录本周纪念日':'每满 7 天可记录纪念日'}</button><button class="danger" data-breakup="${esc(id)}">结束交往</button></div>`:`<p>告白条件：好感 ≥60、熟悉 ≥50、信任 ≥50、心动 ≥30。当前${loveReady(r)?'可以认真告白':'可以先培养关系'}。</p><div class="choices"><button data-flirt="${esc(id)}" ${loveBusy()||r.familiar<20||r.trust<20?'disabled':''}>温柔表达心意<span class="choicehint">熟悉、信任 ≥20 · 心动 +10 · 好感 +3 · 1 行动 / 10 体力</span></button><button data-confess="${esc(id)}" ${loveBusy()||cool?'disabled':''}>认真告白<span class="choicehint">${cool?'告白后等待 3 天，再给彼此一些时间':'1 行动 / 10 体力 · 条件不足时，对方会希望继续做朋友'}</span></button></div>`}`:`<p>${adultAge(p)===null?'生日资料尚未收录，暂不开放恋爱。':'该角色在当前游戏日期未满 18 岁，暂不开放恋爱。'}仍可进行普通友谊与事业互动。</p>`}`);}
function loveMemory(id,text){state.love.memories.push({id,day:state.day,text});state.love.memories=state.love.memories.slice(-30)}
function spendLove(cost=0){state.ap--;state.stats.energy-=10;state.stats.money-=cost;state.love.lastDay=state.day}
function flirt(id){const p=byId(id),r=state.relations[id];if(!p||!isAdult(p)||!r?.met||state.love.partner||r.familiar<20||r.trust<20||loveBusy())return;spendLove();r.attraction=clamp(r.attraction+10);r.favor=clamp(r.favor+3);log('向 '+p.name+' 温柔表达心意，心动有所增加。');save();modal.close();render();toast('心意已表达，慢慢积累彼此的关系。')}
function confess(id){const p=byId(id),r=state.relations[id],l=state.love;if(!p||!isAdult(p)||!r?.met||l.partner||loveBusy()||state.day-(l.lastConfess[id]||-99)<3)return;spendLove();l.lastConfess[id]=state.day;if(loveReady(r)){l.partner=id;l.since=state.day;l.dates=0;l.anniversaries=[];loveMemory(id,'与 '+p.name+' 认真确认彼此心意，开始交往。');log('在虚构世界线中与 '+p.name+' 开始交往。');save();modal.close();render();popup('新的恋爱篇章',`<p>${esc(p.name)}：在这条故事里，我也想认真了解你。我们一起慢慢走下去吧。</p><div class="buttons"><button class="primary" data-do="close">珍藏这一刻</button></div>`)}else{loveMemory(id,'向 '+p.name+' 告白，对方希望先继续做朋友。');save();modal.close();render();popup('给彼此一点时间',`<p>${esc(p.name)}：谢谢你认真告诉我。现在我更希望我们先继续做朋友，慢慢认识彼此。</p><small>告白未成功。关系不会被强制改变；至少等待 3 天后可再次告白。</small><div class="buttons"><button class="primary" data-do="close">尊重回应</button></div>`)}}
function dateWith(id,kind){const plans={walk:{cost:0,heart:5,trust:4,mood:8,title:'公园散步'},coffee:{cost:150,heart:8,favor:5,mood:10,title:'咖啡约会'},music:{cost:100,heart:6,familiar:6,mood:8,title:'分享音乐'}},d=plans[kind],p=byId(id),r=state.relations[id];if(!d||!p||!isAdult(p)||state.love.partner!==id||!r?.met||loveBusy(d.cost))return;spendLove(d.cost);r.attraction=clamp(r.attraction+d.heart);for(const k of ['trust','favor','familiar'])if(d[k])r[k]=clamp(r[k]+d[k]);state.stats.mood=clamp(state.stats.mood+d.mood);state.love.dates++;loveMemory(id,'与 '+p.name+' 完成「'+d.title+'」，留下了一段温柔的回忆。');log('与 '+p.name+' 完成'+d.title+'。');save();modal.close();render();toast('约会完成，回忆已保存。')}
function anniversaryReady(){const l=state.love;return !!l.partner&&(state.day-l.since+1)%7===0&&!l.anniversaries.includes(state.day)}
function recordAnniversary(id){if(state.love.partner!==id||!isAdult(byId(id))||busy||state.pending||state.event||!anniversaryReady())return;state.love.anniversaries.push(state.day);state.love.anniversaries=state.love.anniversaries.slice(-50);state.stats.mood=clamp(state.stats.mood+10);loveMemory(id,'和 '+byId(id).name+' 记录交往第 '+(state.day-state.love.since+1)+' 天的纪念日。');save();modal.close();render();toast('纪念日已记录 · 心情 +10，不消耗行动。')}
function breakup(id){if(state.love.partner!==id||busy||state.pending||state.event)return;popup('认真结束这段关系',`<p>与 ${esc(byId(id).name)} 结束交往后，保留普通朋友关系、聊天记录与恋爱回忆。重新告白至少需等待 3 天。</p><div class="buttons"><button class="danger" data-breakconfirm="${esc(id)}">确认结束交往</button><button class="ghost" data-romance="${esc(id)}">继续交往</button></div>`)}
function confirmBreakup(id){const l=state.love;if(l.partner!==id||busy||state.pending||state.event)return;loveMemory(id,'与 '+byId(id).name+' 平静结束交往，保留普通朋友关系。');l.partner=null;l.since=0;l.dates=0;l.anniversaries=[];l.lastConfess[id]=state.day;state.relations[id].attraction=clamp(state.relations[id].attraction-10);save();modal.close();render();toast('已结束交往，普通关系和聊天记录保留。')}
function romanceReply(p,text,r){if(!/喜欢|爱你|约会|恋爱|想你|亲亲/.test(text))return null;if(!isAdult(p))return '谢谢你的关心。我们在这条故事里保持普通朋友关系，一起聊聊生活和舞台吧。';if(state.love.partner===p.id)return '在这条故事里，能和你一起认真经营这段关系，我很开心。下一次约会，你想去散步还是一起听音乐？';return r.trust>=50?'谢谢你愿意告诉我。如果想推进这条虚构世界线里的关系，可以在角色档案的「恋爱篇章」里认真表达心意。':'谢谢你的心意。我们先从朋友开始，好好认识彼此吧。'}

})();
</script></body></html>
