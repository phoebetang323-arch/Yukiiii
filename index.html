function status(r){return !r?.met?'尚未认识':r.trust>=60&&r.familiar>=60?'亲近朋友':r.trust>=30&&r.familiar>=30?'朋友':r.familiar>=15?'熟悉的伙伴':'初次认识'}
function contact(r){return r?.met&&r.familiar>=15&&r.trust>=10}
function date(){const d=new Date(Date.UTC(state.year,0,state.day));return d.toISOString().slice(0,10).replace(/-/g,'.')}
function log(text){state.logs.unshift({day:state.day,text});state.logs=state.logs.slice(0,100)}
function news(title,text,tag='世界线动态'){state.feed.unshift({day:state.day,title,text,tag});state.feed=state.feed.slice(0,60)}
function avatar(p){return `<div class="avatar">${esc(p.name.slice(0,2))}</div>`}
function metric(label,val){return `<div class="metric">${label}<b>${Math.round(val)} / 100</b><div class="meter"><i style="width:${clamp(val)}%"></i></div></div>`}
function popup(title,body){modal.innerHTML=`<div class="modalhead"><h2>${esc(title)}</h2><button data-do="close" aria-label="关闭">×</button></div>${body}`;if(!modal.open)modal.showModal()}
function welcome(){root.innerHTML=`<div class="welcome"><header class="welcomeheader"><div class="brand">K-STAR<span> LIFE</span></div><span class="pill">VOL. 01 · 虚构互动模拟</span></header><div class="welcomecontent"><section class="intro"><div class="eyebrow">YOUR STORY, YOUR SPOTLIGHT</div><h1>下一束聚光灯，<br>为你而亮。</h1><p>从练习室到舞台，从初次相遇到熟悉的朋友。<br>进入属于你的 K-pop 世界，写下自己的故事。</p><div class="intro-art"><div class="stage-art"><span class="star">✦</span></div><b>THE BEGINNING OF YOUR ERA</b></div><div class="notice">非官方同人模拟游戏。公开姓名与组合资料用于角色索引；性格、对话、关系与行程均为虚构，与你现实中的爱豆无关。</div></section><section class="card"><div class="step">01 / CREATE YOUR LIFE</div><h2>你的故事，从这里开始</h2><p class="muted" style="font-size:12px;margin:7px 0 20px">选择身份，再决定如何走向舞台。</p><form id="create"><label style="font-size:12px;font-weight:700">选择身份</label><div class="rolecards">${Object.entries(D.roles).map(([r,v])=>`<button type="button" class="rolebtn ${role===r?'active':''}" data-role="${r}">${r}<small>${v.desc}</small></button>`).join('')}</div><div class="fields"><div class="field"><label for="name">角色名</label><input id="name" name="name" maxlength="24" required placeholder="你的艺名" value="星禾"></div><div class="field"><label for="age">年龄</label><input id="age" name="age" type="number" min="18" max="65" value="20" required></div><div class="field"><label for="gender">性别</label><select id="gender" name="gender"><option>女</option><option>男</option><option>非二元</option><option>不透露</option></select></div><div class="field"><label for="year">开始年份</label><select id="year" name="year"><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select></div><div class="field full"><label for="company">公司 / 工作环境（虚构起点）</label><select id="company" name="company"><option>独立发展</option><option>JYP Entertainment</option><option>BELIFT LAB</option><option>SM Entertainment</option><option>STARSHIP Entertainment</option><option>自定义工作室</option></select></div><div class="field full"><label for="bio">关于你</label><textarea id="bio" name="bio" maxlength="250" placeholder="你的目标、性格或擅长的事……"></textarea></div></div><button class="primary" style="width:100%;margin-top:20px">开始我的人生 ↗</button></form><button data-do="import" class="ghost" style="width:100%;margin-top:10px">导入已有存档</button><small style="display:block;text-align:center;font-size:10px;margin-top:13px">无需 API 即可游玩 · 进度自动保存于当前浏览器</small></section></div></div>`}
const navs=[['home','⌂','首页'],['schedule','▦','行程'],['relations','♡','关系'],['messages','✉','消息'],['world','◎','娱乐圈'],['profile','◇','我的']];
function render(){if(!state){welcome();return}const p=state.player;root.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">K-STAR<span> LIFE</span></div><div class="eyebrow">MAKE YOUR OWN ERA</div><nav class="nav" aria-label="主导航">${navs.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><em aria-hidden="true">${icon}</em>${label}</button>`).join('')}</nav><div class="sidefoot"><b>YOUR WORLDLINE</b><br>第 ${state.day} 天 · ${esc(p.role)}<br><br>公开资料 / 虚构故事<br>K-STAR LIFE v1.1</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">${page==='home'?'WELCOME TO YOUR WORLD':navs.find(n=>n[0]===page)[2]+' / K-STAR LIFE'}</div><small>${date()} · 第 ${state.day} 天</small></div><div class="right"><span class="pill">${config.enabled?'AI 已启用':'离线剧情'}</span><small>${esc(p.name)}</small>${avatar(p)}</div></header><div id="view">${({home:home,schedule:schedule,relations:relations,messages:messages,world:world,profile:profile}[page])()}</div></main></div>`;if(page==='messages')$('#chatlog')?.scrollTo(0,999999);if(state.pending&&!modal.open)encounter()}
function home(){const s=state.stats,p=state.player;return `<section class="hero"><div class="copy"><div class="eyebrow">CHAPTER ${String(state.day).padStart(2,'0')} · YOUR NEXT STAGE</div><h1>${esc(p.name)}，<br>今天也向梦想靠近。</h1><p>${state.ap?'练习、相遇，或给自己一段休息时间。':'今天的故事已写下，好好休息后开启新一天。'}<br>剩余 ${state.ap} 次行动 · ${esc(p.role)} / ${esc(p.company)}</p><button class="primary" data-page="schedule">安排今天的行程 ↗</button></div><div class="stage-art" aria-hidden="true"><span class="star">✦</span></div></section><div class="stats"><div class="stat"><small>♡ 关注你的粉丝</small><b>${fmt(s.fans)}</b><small>从每一个小舞台开始</small></div><div class="stat"><small>✧ 体力</small><b>${s.energy}<small> / 100</small></b><div class="meter"><i style="width:${s.energy}%"></i></div></div><div class="stat"><small>☀ 心情</small><b>${s.mood}<small> / 100</small></b><small>${s.mood>65?'今天的状态很不错':'慢慢来，照顾好自己'}</small></div><div class="stat"><small>◇ 可用资金</small><b>₩ ${fmt(s.money)}</b><small>游戏内虚构货币</small></div></div><div class="grid2"><section class="card"><div class="sectionhead"><h3>今日灵感</h3><button class="ghost" data-page="schedule">全部行程 ↗</button></div>${D.actions.slice(0,3).map(a=>`<div class="row"><div class="tileicon">${a.icon}</div><div class="fill"><b>${a.title}</b><p>${a.place}</p></div><button data-action="${a.id}" ${disabled(a)?'disabled':''}>开始</button></div>`).join('')}<div class="buttons"><button class="black" data-do="next" ${state.pending?'disabled':''}>结束今天 · 下一天 →</button></div></section><section class="card"><div class="sectionhead"><h3>最近的故事</h3><span class="pill">WORLDLINE</span></div>${state.logs.slice(0,4).map(l=>`<div class="logentry"><small>DAY ${l.day}</small>${esc(l.text)}</div>`).join('')}<button class="ghost" data-page="world">查看娱乐圈动态 ↗</button></section></div>`}
function disabled(a){return busy||!!state.pending||state.ap<=0||state.stats.energy<a.energy||state.stats.money<a.cost||state.done.includes(a.id)}
function schedule(){return `<div class="title"><div class="eyebrow">DAILY PLANNER</div><h1>今天，想做些什么？</h1><p>每天最多 3 次行动，每项行程每天一次。体力 ${state.stats.energy} · 资金 ₩ ${fmt(state.stats.money)}</p></div><div class="sectionhead"><span class="pill">剩余 ${state.ap} / 3 次行动</span><button class="black" data-do="next">下一天 →</button></div><div class="actions">${D.actions.map(a=>`<article class="action"><div class="tileicon">${a.icon}</div><h3>${a.title}</h3><small>${a.place}</small><p>${a.desc}</p><div class="foot"><span>${a.energy<0?'体力 +35':'体力 −'+a.energy} ${a.cost?'· ₩ '+a.cost:''}</span><button class="${a.id==='rest'?'ghost':'primary'}" data-action="${a.id}" ${disabled(a)?'disabled':''}>${state.done.includes(a.id)?'今日已完成':'开始行程 ↗'}</button></div></article>`).join('')}</div>`}
function relations(){const list=idols.filter(p=>(filter==='全部'||(filter==='已认识'?state.relations[p.id]?.met:p.group===filter))&&(`${p.name} ${p.group}`.toLowerCase().includes(search.toLowerCase())));return `<div class="title"><div class="eyebrow">PEOPLE IN YOUR STORY</div><h1>每一次相遇，都有后续。</h1><p>已认识 ${Object.values(state.relations).filter(r=>r.met).length} / ${idols.length} 位成员 · 公开资料核对：${D.checked}</p></div><input class="search" id="search" aria-label="搜索成员或组合" placeholder="搜索成员或组合…" value="${esc(search)}"><div class="filters">${['全部','已认识',...D.groups.map(g=>g.name)].map(g=>`<button class="${filter===g?'active':''}" data-filter="${g}">${g}</button>`).join('')}</div><div class="people">${list.map(p=>{const r=state.relations[p.id];return `<article class="person"><div class="portrait" style="--tone:${p.color}" aria-label="姓名字母装饰，非本人肖像">${esc(p.name.slice(0,2))}</div><div class="personbody"><h3>${p.name}</h3><p>${p.group} · ${status(r)}</p>${r?.met?metric('好感',r.favor):'<div class="muted" style="font-size:11px;margin:12px 0">在行程中等待你们的初次相遇</div>'}<div class="bottom"><button class="ghost" data-person="${esc(p.id)}">角色档案</button>${r?.met?`<button class="primary" data-interact="${esc(p.id)}">互动</button>`:''}</div></div></article>`}).join('')}</div>${!list.length?'<div class="empty">没有找到成员，试试其他关键词。</div>':''}<div class="notice">基础姓名、组合和生日来自官方资料；不包含现实私生活信息。图形为文字装饰，关系和性格只属于你的游戏世界线。</div>`}
function person(id){const p=byId(id),r=state.relations[id];popup(p.name,`<span class="pill">${p.group}</span><p style="margin:16px 0;font-size:14px">所属：${p.company}<br>生日：${p.birth}<br>关系：${status(r)}</p>${r?.met?`<div class="metrics">${metric('好感',r.favor)+metric('熟悉',r.familiar)+metric('信任',r.trust)+metric('警戒',r.guard)}</div><p class="muted" style="font-size:12px">${contact(r)?'已建立联系，可以在消息中私聊。':'熟悉 ≥15、信任 ≥10 后，解锁游戏内联系。'}</p><div class="buttons"><button class="primary" data-interact="${esc(id)}">安排互动</button>${contact(r)?`<button data-chat="${esc(id)}">进入消息</button>`:''}</div>`:'<p class="muted">通过音乐节目、Challenge 或交流会认识对方。</p>'}<div class="notice">所有游戏内对话与关系为虚构。未设定或推断本人的真实性格。</div><a href="${p.source}" target="_blank" rel="noopener noreferrer">查看官方资料 ↗</a>`)}
function interact(id){const r=relation(id);if(!r.met)return;popup('和 '+byId(id).name+' 互动',`<p class="muted" style="font-size:13px">消耗 1 次行动与 10 点体力。每天可安排一次社交互动。</p><div class="choices"><button data-social="${esc(id)}" data-kind="talk">聊聊最近的舞台<span class="choicehint">熟悉 +8 · 好感 +5 · 信任 +4</span></button><button data-social="${esc(id)}" data-kind="support">表达支持与感谢<span class="choicehint">好感 +8 · 信任 +6</span></button><button data-social="${esc(id)}" data-kind="collab" ${r.familiar<20?'disabled':''}>邀请合作舞台<span class="choicehint">需要熟悉 ≥20 · 资金 ₩200 · 获得粉丝</span></button></div>`)}
function social(id,kind){if(!state.relations[id]?.met||!['talk','support','collab'].includes(kind))return;const r=relation(id);if(busy||state.pending||!state.ap||state.stats.energy<10||state.socialDay===state.day){toast('今天无法再安排社交互动，请休息后再来。');return}if(kind==='collab'&&(r.familiar<20||state.stats.money<200)){toast('合作需要熟悉 ≥20 和 ₩200。');return}state.ap--;state.stats.energy-=10;state.socialDay=state.day;const delta=kind==='talk'?{familiar:8,favor:5,trust:4,guard:-3}:kind==='support'?{familiar:4,favor:8,trust:6,guard:-4}:{familiar:10,trust:8,favor:6,guard:-5};for(const [k,v]of Object.entries(delta))r[k]=clamp(r[k]+v);if(kind==='collab'){state.stats.money-=200;state.stats.fans+=180;news('一段合作舞台，收获新的关注',`${state.player.name} 与 ${byId(id).name} 在这条虚构世界线里完成了合作。`)}log(`与 ${byId(id).name} ${kind==='talk'?'交流舞台经验':kind==='support'?'表达支持':'完成合作'}，关系变得更加熟悉。`);save();modal.close();render();toast(contact(r)?'互动完成，游戏内联系已解锁。':'互动完成，关系已更新。')}
function messages(){const contacts=idols.filter(p=>contact(state.relations[p.id]));if(!contacts.length)return `<div class="title"><div class="eyebrow">PRIVATE MESSAGES</div><h1>让故事继续。</h1><p>通过相遇与互动，建立属于这条世界线的联系。</p></div><section class="card empty"><h3>暂时没有联系人</h3><p style="margin:12px 0 20px">认识后，熟悉达到 15、信任达到 10 即可解锁消息。</p><button class="primary" data-page="schedule">去安排一次相遇 ↗</button></section>`;if(!contacts.some(p=>p.id===selected))selected=contacts[0].id;const p=byId(selected),chat=state.chats[selected]||[];return `<div class="title"><div class="eyebrow">PRIVATE MESSAGES</div><h1>舞台之外的一句问候。</h1><p>虚构角色聊天 · ${config.enabled?'尝试 AI 回复，失败时明确提示':'离线分支回复'} · 不是真实爱豆本人</p></div><div class="chatlayout"><aside class="card contacts">${contacts.map(p=>`<button class="contact ${p.id===selected?'active':''}" data-chat="${esc(p.id)}">${avatar(p)}<span>${p.name}<small style="display:block;font-size:10px">${p.group}</small></span></button>`).join('')}</aside><section class="card chatbox"><div class="chathead">${avatar(p)}<div class="fill"><h3>${p.name}</h3><small>${status(relation(p.id))} · 虚构角色</small></div></div><div class="chatlog" id="chatlog" aria-live="polite">${chat.length?chat.map(m=>`<div class="bubble ${m.role==='user'?'user':''}"><small>${m.role==='user'?esc(state.player.name):p.name} · ${m.mode==='ai'?'AI 剧情':m.mode==='fallback'?'离线补充':m.role==='user'?'玩家':'离线剧情'}</small>${esc(m.text)}</div>`).join(''):'<div class="empty">新的故事，从一句「你好」开始。</div>'}${busy?'<div class="bubble">正在整理回复…</div>':''}</div><form id="send" class="composer"><label class="sr" for="msg">发送消息</label><input id="msg" name="msg" maxlength="1000" required placeholder="写下你想说的话…" ${busy?'disabled':''}><button class="primary" ${busy?'disabled':''}>发送</button></form><div class="quick">${['最近练习顺利吗？','下次一起拍 Challenge 吧','今天有一点累'].map(t=>`<button data-quick="${t}" ${busy?'disabled':''}>${t}</button>`).join('')}</div></section></div><div class="notice">聊天不消耗行程；关系成长每日最多 3 次。API 密钥仅保留在当前标签页会话，不写入存档。</div>`}
function offlineReply(p,text,r){const n=state.player.name;if(/累|难过|压力|紧张|不开心/.test(text))return `${n}，先给自己一点休息时间吧。我们在这条故事里慢慢来，今天能完成一件小事就很不错了。你想聊聊发生了什么吗？`;if(/challenge|合作|舞台|跳舞/i.test(text))return r.trust>=25?`可以呀！我们先挑一段都熟悉的动作，明天交流一下拍摄方案。你更想尝试有力度的风格，还是轻松一点的？`:`这个想法很有趣。我们先交流练习心得，等彼此再熟悉一点，一起准备合作会更自然。`;if(/练习|唱|音乐|歌/.test(text))return rand([`今天在反复练一段节奏，终于比昨天顺了一点。${n}，你今天也有小小的进步吗？`,'最近在整理练习笔记。比起一次做到完美，我更想每天进步一点。你最喜欢哪一种舞台？']);if(/你好|嗨|hello/i.test(text))return `你好，${n}！${r.familiar>30?'又收到你的消息，真好。':'很高兴在活动后还能和你聊聊。'}今天的行程怎么样？`;if(/喜欢|爱你|约会|恋爱/.test(text))return r.trust>=60?'谢谢你愿意认真告诉我。我们已经在故事里积累了很多信任，我想慢慢了解你的想法，给彼此一点时间。':'谢谢你的心意。我们先从朋友开始，好好认识彼此吧。';if(/谢谢|晚安|再见/.test(text))return '也谢谢你今天的陪伴。好好休息，下一次见面时，再聊聊新的故事。';return rand([`${n}，我在认真听。你说的这件事，让我想到我们上次在活动区见面的时刻。你最在意的部分是什么？`,'听起来是值得好好想一想的事。如果由你决定，下一步最想做什么？',`收到你的消息了！今天的行程刚告一段落。${r.familiar>30?'和熟悉的朋友聊聊，让人放松不少。':'我们慢慢聊，也慢慢熟悉起来。'}你今天有遇到什么有趣的事吗？`])}
async function sendMessage(text){if(busy||!state||!contact(state.relations[selected]))return;const id=selected,p=byId(id),r=relation(id);text=text.trim().slice(0,1000);if(!text)return;busy=true;const chat=state.chats[id]||(state.chats[id]=[]);chat.push({role:'user',text});state.chats[id]=chat.slice(-119);save();render();let reply,mode='offline';try{if(config.enabled){if(!config.model)throw Error('请先在 API 设置里选择模型');const history=state.chats[id].slice(-12).map(m=>({role:m.role,content:m.text}));const response=await requestAPI('chat',{messages:history,character:{name:p.name,group:p.group},player:{name:state.player.name,role:state.player.role,age:state.player.age,bio:state.player.bio},relationship:{familiar:r.familiar,trust:r.trust},model:config.model});reply=response.reply;mode='ai';}else reply=offlineReply(p,text,r)}catch(e){toast('AI 回复失败：'+e.message+'。本次使用离线剧情。');reply=offlineReply(p,text,r);mode='fallback'}finally{state.chats[id].push({role:'assistant',text:String(reply).slice(0,6000),mode});state.chats[id]=state.chats[id].slice(-120);if(r.chatDay!==state.day){r.chatDay=state.day;r.chatCount=0}if((r.chatCount||0)<3){r.familiar=clamp(r.familiar+2);r.trust=clamp(r.trust+1);r.chatCount=(r.chatCount||0)+1}busy=false;save();render()}}
function world(){return `<div class="title"><div class="eyebrow">INSIDE YOUR K-POP WORLD</div><h1>你的娱乐圈，正在发生。</h1><p>游戏内模拟动态，与你现实中的新闻和行程无关。</p></div><div class="grid2"><section>${state.feed.map(f=>`<article class="card feed"><div class="tag">${esc(f.tag)} · DAY ${f.day}</div><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p></article>`).join('')}</section><aside><section class="card"><h3>你的能力与口碑</h3><div class="metrics">${metric('声乐',state.stats.vocal)+metric('舞蹈',state.stats.dance)+metric('舞台',state.stats.stage)+metric('口碑',state.stats.reputation)}</div><p class="muted" style="font-size:12px">练习生声乐、舞蹈 ≥40，舞台 ≥25 后，可以参加出道评估。新人爱豆可准备回归企划。</p><div class="buttons"><button class="primary" data-do="career">${state.player.role==='练习生'?'参加出道评估':state.player.role==='新人爱豆'?'准备回归作品':'推进职业企划'}</button></div></section><section class="card" style="margin-top:18px"><h3>组合档案索引</h3>${D.groups.map(g=>`<div class="row"><div class="fill"><b>${g.name}</b><p>${g.members.length} 位成员 · ${g.company}</p></div><a href="${g.source}" target="_blank" rel="noopener noreferrer" aria-label="${g.name} 官方资料">↗</a></div>`).join('')}<small>资料核对日期：${D.checked}。名单为此版本快照，不自动同步现实变动。</small></section></aside></div>`}
function profile(){return `<div class="title"><div class="eyebrow">MY LIFE, MY SETTINGS</div><h1>把故事写成你的样子。</h1><p>角色、存档与 AI 连接，都在这里。</p></div><div class="grid2"><section><div class="card"><div class="row">${avatar(state.player)}<div class="fill"><h2>${esc(state.player.name)}</h2><p>${esc(state.player.role)} · ${state.player.age} 岁 · ${esc(state.player.gender)}</p><p>${esc(state.player.company)}</p></div></div><p style="font-size:13px;margin-top:15px">${esc(state.player.bio||'还没有填写自我介绍。')}</p><div class="metrics">${metric('声乐',state.stats.vocal)+metric('舞蹈',state.stats.dance)+metric('舞台',state.stats.stage)+metric('口碑',state.stats.reputation)}</div></div><div class="card" style="margin-top:18px"><h3>我的存档</h3><p class="muted" style="font-size:12px;margin-top:9px">自动保存至当前浏览器；换设备前请导出。存档不包含 API 密钥。</p><div class="buttons"><button class="primary" data-do="export">导出存档</button><button class="ghost" data-do="import" ${busy?'disabled':''}>导入存档</button><button class="danger" data-do="reset" ${busy?'disabled':''}>开始新人生</button></div></div></section><section class="card"><h3>API 设置</h3><p class="muted" style="font-size:12px;margin:8px 0 20px">支持 OpenAI 兼容 Chat Completions 接口。不连接也能正常游玩。</p><form id="api"><div class="fields"><div class="field full"><label for="mode">连接方式</label><select name="mode" id="mode"><option value="direct" ${config.mode==='direct'?'selected':''}>浏览器直连（需要服务商允许 CORS）</option></select></div><div class="field full"><label for="base">API Base URL（包含 /v1）</label><input name="base" id="base" type="url" required value="${esc(config.base)}" placeholder="https://api.example.com/v1"></div><div class="field full"><label for="key">API Key（仅当前标签页会话）</label><input name="key" id="key" type="password" autocomplete="off" value="${esc(apiKey)}" placeholder="输入你的密钥"></div><div class="field full"><label for="model">模型 ID</label><input name="model" id="model" list="models" value="${esc(config.model)}" placeholder="先拉取模型，也可以手动填写"><datalist id="models"></datalist></div></div><label class="checkline"><input name="enabled" type="checkbox" ${config.enabled?'checked':''}>使用 AI 生成聊天回复</label><div class="buttons"><button class="primary" ${apiBusy?'disabled':''}>保存设置</button><button type="button" class="ghost" data-do="models" ${apiBusy?'disabled':''}>拉取模型</button><button type="button" class="ghost" data-do="test" ${apiBusy?'disabled':''}>测试连接</button></div><p id="api-result" role="status" class="muted" style="font-size:12px;margin-top:16px"></p></form><div class="notice">AI 对话会将最近 12 条聊天、角色介绍和关系数值发送到你设置的服务商。GitHub Pages 仅提供静态网页；本版直接连接服务商，需要对方允许浏览器 CORS。密钥请在此处输入，不要写入仓库或 Actions 配置。</div></section></div>`}
async function action(id){const a=D.actions.find(a=>a.id===id);if(!a||disabled(a))return;state.ap--;state.done.push(id);state.stats.energy=clamp(state.stats.energy-a.energy);state.stats.money+= (a.income||0)-a.cost;state.stats.mood=clamp(state.stats.mood+(id==='rest'?15:2));if(a.skill)state.stats[a.skill]=clamp(state.stats[a.skill]+a.gain);state.stats.fans+=a.fans||0;log(`完成「${a.title}」${a.skill?'，能力有所进步':''}${a.income?'，获得 ₩'+a.income:''}。`);if(a.fans&&id!=='cafe')news(id==='sns'?'一条新动态，新的回应':a.title+'带来新的关注',`${state.player.name} 完成今日行程，增加 ${a.fans} 位游戏内粉丝。`,'事业记录');if(a.meet){const met=idols.filter(p=>state.relations[p.id]?.met);const pool=Math.random()<.5&&met.length?met:idols;state.pending={id:rand(pool).id,type:id}}save();render();if(!a.meet)toast('行程完成，进度已保存。')}
function encounter(){if(!state.pending)return;const p=byId(state.pending.id),r=relation(p.id);popup('活动中的相遇',`<span class="pill">虚构世界线 · ${p.group}</span><p class="modaltext" style="margin-top:18px">${state.player.role==='粉丝'?'在官方公开活动的互动环节':state.pending.type==='cafe'?'在行业交流会的活动区':'在活动现场的交流区'}，你遇见了 ${p.name}。${r.met?'对方认出了你，向你点头。':'工作人员介绍了彼此，你们有了短暂交流的机会。'}\n\n你打算怎么回应？</p><div class="choices"><button data-choice="greet">礼貌打招呼<span class="choicehint">建立温和的第一印象 · 熟悉与信任上升</span></button><button data-choice="music">聊聊今天的音乐<span class="choicehint">从共同话题开始 · 更快积累熟悉</span></button><button data-choice="space">微笑示意，保留空间<span class="choicehint">尊重活动节奏 · 警戒下降</span></button></div>`)}
function choose(kind){if(!state.pending||!['greet','music','space'].includes(kind))return;const p=byId(state.pending.id),r=relation(p.id);r.met=true;const changes=kind==='greet'?{favor:7,familiar:8,trust:6,guard:-4}:kind==='music'?{favor:6,familiar:12,trust:5,guard:-3}:{favor:3,familiar:4,trust:4,guard:-7};for(const[k,v]of Object.entries(changes))r[k]=clamp(r[k]+v);log(`在活动中与 ${p.name} ${kind==='music'?'交流音乐':kind==='greet'?'互相问候':'友好示意'}。`);state.pending=null;save();modal.close();render();toast(contact(r)?'关系更新，消息已解锁。':'已认识 '+p.name+'，可在关系页继续互动。')}
function next(){if(busy||state.pending){toast('请先完成当前互动。');return}state.day++;state.ap=3;state.done=[];state.stats.energy=clamp(state.stats.energy+40);state.stats.mood=clamp(state.stats.mood+7);for(const r of Object.values(state.relations))r.risk=clamp(r.risk-2);if(state.day%3===0){const text=rand(['新的创作交流活动开放报名，现场可能出现新的相遇。','一段练习室短片在游戏世界里引发讨论，认真准备下一次舞台吧。','本周的公开舞台企划正在筹备，每一个小舞台都有新的可能。']);news('新一天，新的机会',text,'行业动态')}log('开启新的一天，恢复体力，获得 3 次行动。');save();render();toast('新的一天开始了。')}
function career(){if(busy||state.pending||state.ap<1||state.stats.energy<20){toast('需要 1 次行动与 20 点体力。');return}const s=state.stats,r=state.player.role;if(r==='练习生'&&(s.vocal<40||s.dance<40||s.stage<25)){toast('出道评估需要声乐 ≥40、舞蹈 ≥40、舞台 ≥25。');return}if(r!=='练习生'&&(s.money<1000||s.stage<25)){toast('职业企划需要资金 ₩1000、舞台能力 ≥25。');return}if(state.careerDay&&state.day-state.careerDay<7){toast('职业企划每 7 天可推进一次。');return}state.ap--;s.energy-=20;state.careerDay=state.day;if(r==='练习生'){state.player.role='新人爱豆';s.fans+=500;log('通过出道评估，正式开启新人爱豆生涯。');news('你的第一束聚光灯',`${state.player.name} 在这条世界线里正式出道。`,'事业里程碑')}else{s.money-=1000;const fans=200+Math.floor((s.vocal+s.stage)*3);s.fans+=fans;s.reputation=clamp(s.reputation+8);const title=r==='新人爱豆'?'全新作品上线':r==='粉丝'?'完成应援企划':r==='制作人'?'原创作品发布':'完成行程统筹企划';news(title,`${state.player.name} 完成职业企划，增加 ${fans} 位关注者。`,'事业里程碑');log(title+'，口碑有所提升。')}save();render();toast('职业故事已推进。')}
function collectAPI(){const f=$('#api');if(!f)return;if(!f.reportValidity())throw Error('请填写有效的 API 地址');const values=new FormData(f);const base=String(values.get('base')).trim().replace(/\/+$/,'');const u=new URL(base);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('API 地址须为无账号、参数及片段的 HTTPS 地址');config={base,model:String(values.get('model')||'').trim(),mode:'direct',enabled:values.get('enabled')==='on'};apiKey=String(values.get('key')||'').trim();saveConfig()}
const systemPrompt='你是非官方 K-pop 同人模拟游戏中的虚构角色。明确这是玩家世界线中的虚构互动，不是真人本人。只根据提供的游戏角色与关系数据生成自然的中文对话，不声称知道真人私生活、真实性格、真实恋情、最新行程或秘密，不编造这些现实事实。玩家均为成年人。对话保持友善、尊重边界，不生成露骨色情、骚扰或现实跟踪指导。回复最多180个中文字。';
async function requestAPI(operation,payload={}){if(!apiKey)throw Error('尚未填写 API Key');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{let response;{const url=config.base+(operation==='models'?'/models':'/chat/completions');const headers={'Authorization':'Bearer '+apiKey};const body={model:payload.model,messages:[{role:'system',content:systemPrompt+'\n游戏设定：'+JSON.stringify({character:payload.character,player:payload.player,relationship:payload.relationship})},...(payload.messages||[{role:'user',content:'请回复一句简短问候，用于连接测试。'}])],max_tokens:400,temperature:.8};response=await fetch(url,{method:operation==='models'?'GET':'POST',headers:operation==='models'?headers:{...headers,'Content-Type':'application/json'},...(operation==='models'?{}:{body:JSON.stringify(body)}),signal:controller.signal})}if(!response.ok){let message=`HTTP ${response.status}`;try{const j=await response.json();const detail=j.error?.message||j.error;if(typeof detail==='string')message+=' · '+detail.slice(0,220)}catch(e){if(response.status===404)message+=' · 请检查 API 根地址和接口路径'}throw Error(message)}const j=await response.json();if(operation==='models'){const list=j.data?.map(m=>m.id);if(!Array.isArray(list)||!list.every(m=>typeof m==='string'))throw Error('接口未返回有效的模型列表');return {models:list.slice(0,500)}}const reply=j.choices?.[0]?.message?.content;if(typeof reply!=='string'||!reply.trim())throw Error('模型未返回文字，请使用支持 Chat Completions 的文本模型');return {reply}}catch(e){if(e.name==='AbortError')throw Error('请求超时，请检查地址与网络');if(e instanceof TypeError)throw Error('无法连接：检查网络、API 地址或服务商 CORS 支持');throw e}finally{clearTimeout(timer)}}
async function apiAction(kind){if(apiBusy)return;let result;try{collectAPI();if(kind==='test'&&!config.model)throw Error('请先拉取或填写模型 ID');apiBusy=true;result=$('#api-result');result.textContent=kind==='models'?'正在拉取模型…':'正在测试连接…';$('#api').querySelectorAll('button').forEach(b=>b.disabled=true);const j=await requestAPI(kind==='models'?'models':'test',{model:config.model});if(!result.isConnected)return;if(kind==='models'){if(!j.models.length)throw Error('接口返回了空模型列表，请手动填写模型 ID');$('#models').innerHTML=j.models.map(m=>`<option value="${esc(m)}">`).join('');if(!config.model||!j.models.includes(config.model)){config.model=j.models[0];$('#model').value=config.model;saveConfig()}result.textContent=`成功获取 ${j.models.length} 个模型。点击模型输入框可选择，也可直接输入 ID。`}else result.textContent='连接成功：'+j.reply.slice(0,160)}catch(e){if(result?.isConnected)result.textContent='失败：'+e.message;else toast(e.message)}finally{apiBusy=false;$('#api')?.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kstar-save-day'+state.day+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('存档已导出，不含 API 密钥。')}
function importSave(){if(busy)return;const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{if(file.size>2e6)throw Error('存档文件不能超过 2 MB');const s=validate(JSON.parse(await file.text()));if(state&&!confirm('导入会替换当前进度，继续吗？'))return;state=s;page='home';selected=null;save();modal.close();render();toast('存档已导入。')}catch(e){toast('导入失败：'+e.message)}};input.click()}
root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;$('#view').innerHTML=relations();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
function click(e){const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){if(busy&&b.dataset.page!=='messages'){toast('正在等待回复，请稍候。');return}page=b.dataset.page;modal.close();render();scrollTo(0,0)}if(b.dataset.role){role=b.dataset.role;root.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===role))}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.action)action(b.dataset.action);if(b.dataset.person)person(b.dataset.person);if(b.dataset.interact)interact(b.dataset.interact);if(b.dataset.social)social(b.dataset.social,b.dataset.kind);if(b.dataset.chat){selected=b.dataset.chat;page='messages';modal.close();render()}if(b.dataset.quick)sendMessage(b.dataset.quick);if(b.dataset.choice)choose(b.dataset.choice);if(b.dataset.do){switch(b.dataset.do){case'close':if(state?.pending){toast('请先选择如何回应这次相遇。');return}modal.close();break;case'next':next();break;case'career':career();break;case'export':exportSave();break;case'import':importSave();break;case'models':apiAction('models');break;case'test':apiAction('test');break;case'reset':if(busy)return;if(confirm('开始新人生会替换当前进度。建议先导出存档。继续吗？')){state=null;try{localStorage.removeItem(KEY)}catch(e){}modal.close();page='home';selected=null;render()}break;}}}
root.addEventListener('click',click);modal.addEventListener('click',click);modal.addEventListener('cancel',e=>{if(state?.pending){e.preventDefault();toast('请先完成这次相遇。')}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='create'){const f=new FormData(e.target),name=String(f.get('name')).trim(),age=Number(f.get('age'));if(!name||age<18||age>65)return;const v=D.roles[role];state={version:1,year:Number(f.get('year')),day:1,ap:3,player:{name,age,role,gender:String(f.get('gender')),company:String(f.get('company')),bio:String(f.get('bio'))},stats:{energy:100,mood:85,vocal:v.vocal,dance:v.dance,stage:v.stage,reputation:30,fans:v.fans,money:v.money},relations:{},chats:{},logs:[],feed:[],done:[],pending:null};log('以'+role+'的身份，开启了自己的 K-pop 人生。');news('欢迎来到你的 K-pop 世界',`${name} 的故事从今天开始。通过行程训练能力，或在活动中认识新的朋友。`,'故事开篇');save();render();scrollTo(0,0)}else if(e.target.id==='send'){sendMessage(String(new FormData(e.target).get('msg')||''))}else if(e.target.id==='api'){try{collectAPI();toast('API 设置已保存。');render()}catch(e){toast(e.message)}}});
render();
})();
</script></body></html>
